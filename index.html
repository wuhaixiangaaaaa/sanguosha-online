<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>三国杀 · 经典复刻（单机雏形）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%235a1410'/%3E%3Crect x='5' y='5' width='54' height='54' rx='8' fill='none' stroke='%23d9b86a' stroke-width='2.5'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23e8c87e' font-family='serif' font-weight='bold'%3E%E6%9D%80%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
/* ==================== 基础与变量 ==================== */
:root{
  --wood-dark:#241710; --wood:#3a2617; --wood-light:#4d3420;
  --gold:#d9b86a; --gold-bright:#f0d49a; --gold-deep:#a07c3c;
  --paper:#f1e3c2; --paper-edge:#c9a866;
  --ink:#2b1a0e; --red-suit:#c1272d; --black-suit:#1d1a17;
  --wei:#5b8fd0; --shu:#cf5243; --wu:#4ca874; --qun:#b3a077;
  --basic:#e8d3a2; --trick:#e3c15f; --equip:#9fc0b8;
  --shadow:0 4px 14px rgba(0,0,0,.45);
  --serif:"Noto Serif SC", "Songti SC", "SimSun", serif;
  --brush:"Ma Shan Zheng","Noto Serif SC",serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:var(--serif); color:#efe2c4; background:#160d08;
  user-select:none; -webkit-user-select:none;
}
button{font-family:var(--serif);cursor:pointer;border:none;outline:none;}
.hidden{display:none !important;}
.view{position:absolute;inset:0;overflow:hidden;}

/* 木纹牌桌底 */
#table-bg{position:fixed;inset:0;z-index:0;
  background:url("assets/images/bg.jpg") center/cover no-repeat, #2b1a0e;
  filter:saturate(.85) brightness(.72);}
#table-bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(10,5,2,.62) 100%);}

/* ==================== 通用按钮 ==================== */
.btn{
  background:linear-gradient(180deg,#6e4a26,#4a2f16);
  border:1px solid var(--gold-deep); color:var(--gold-bright);
  padding:12px 26px;border-radius:6px;font-size:17px;font-weight:700;
  letter-spacing:3px;box-shadow:var(--shadow), inset 0 1px 0 rgba(255,230,170,.25);
  transition:transform .12s, box-shadow .12s, filter .12s;position:relative;
}
.btn:hover{filter:brightness(1.18);transform:translateY(-2px);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:linear-gradient(180deg,#9c2f22,#6d1a12);border-color:var(--gold);color:#ffe9c0;}
.btn.ghost{background:rgba(30,18,10,.62);color:#cdb784;}
.btn.disabled{opacity:.4;pointer-events:none;}
.btn.small{padding:7px 14px;font-size:14px;letter-spacing:1px;}

/* ==================== 主菜单 ==================== */
#view-menu{display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;
  background:radial-gradient(ellipse at 50% 38%, rgba(80,40,18,.55), rgba(12,7,3,.92));}
.menu-title{text-align:center;margin-bottom:8px;animation:titleIn .9s ease;}
.menu-title h1{font-family:var(--brush);font-size:clamp(64px,11vw,128px);color:var(--gold-bright);
  letter-spacing:14px;text-shadow:0 0 30px rgba(201,163,92,.45),0 4px 6px #000;line-height:1.1;}
.menu-title .sub{font-size:clamp(14px,2vw,20px);letter-spacing:10px;color:#c9a866;margin-top:6px;}
.menu-title .seal{display:inline-block;margin-top:14px;padding:4px 12px;border:2px solid #8e3b2e;
  color:#d98a7a;font-family:var(--brush);font-size:20px;border-radius:4px;transform:rotate(-4deg);letter-spacing:4px;}
.menu-btns{display:flex;flex-direction:column;gap:14px;width:min(360px,82vw);margin-top:44px;}
.menu-btns .btn{width:100%;padding:15px;font-size:18px;}
.btn .tag{position:absolute;right:8px;top:6px;font-size:10px;letter-spacing:1px;color:#9fb6c9;background:rgba(30,60,90,.7);
  border:1px solid #5a7a96;padding:1px 5px;border-radius:3px;font-weight:400;}
.menu-foot{position:absolute;bottom:18px;font-size:12px;color:#8a7455;letter-spacing:2px;text-align:center;width:100%;padding:0 20px;}
@keyframes titleIn{from{opacity:0;transform:translateY(-26px) scale(.96);}to{opacity:1;transform:none;}}

/* ==================== 选将界面 ==================== */
#view-select{z-index:1;background:linear-gradient(180deg,rgba(20,12,6,.94),rgba(32,20,11,.96));
  display:flex;flex-direction:column;}
.sel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;
  border-bottom:1px solid rgba(201,163,92,.3);background:rgba(15,9,5,.6);}
.sel-head h2{font-family:var(--brush);font-size:30px;color:var(--gold-bright);letter-spacing:6px;}
.sel-head .hint{font-size:13px;color:#b89d6b;letter-spacing:2px;}
.general-grid{flex:1;overflow-y:auto;padding:22px;display:grid;gap:18px;
  grid-template-columns:repeat(auto-fill,minmax(172px,1fr));align-content:start;}
.gcard{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;background:#241509;
  border:2px solid #5d4322;transition:transform .15s,border-color .15s,box-shadow .15s;aspect-ratio:3/4.4;}
.gcard:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 10px 24px rgba(0,0,0,.6);}
.gcard.picked{border-color:var(--gold-bright);box-shadow:0 0 0 2px var(--gold),0 8px 22px rgba(217,184,106,.4);}
.gcard.locked{filter:grayscale(.7) brightness(.65);}
.gcard img{width:100%;height:63%;object-fit:cover;object-position:top center;display:block;}
.gcard .g-body{padding:7px 8px 8px;background:linear-gradient(180deg,#2c1b0d,#1d1108);}
.gcard .g-name{font-family:var(--brush);font-size:25px;line-height:1;display:flex;align-items:center;gap:7px;}
.gcard .g-kingdom{font-size:11px;padding:1px 6px;border-radius:3px;color:#fff;font-weight:700;letter-spacing:2px;}
.gcard .g-skills{margin-top:5px;font-size:11px;line-height:1.45;color:#cbb487;min-height:32px;}
.gcard .g-skills b{color:var(--gold-bright);font-weight:600;}
.gcard .hp-jades{position:absolute;top:6px;right:7px;display:flex;gap:2px;flex-wrap:wrap-reverse;max-width:64px;justify-content:flex-end;}
.gcard .soon{position:absolute;inset:0;background:rgba(8,5,2,.55);display:flex;align-items:center;justify-content:center;
  font-family:var(--brush);font-size:26px;color:var(--gold-bright);letter-spacing:6px;pointer-events:none;}
.sel-foot{padding:14px;display:flex;gap:14px;justify-content:center;border-top:1px solid rgba(201,163,92,.3);background:rgba(15,9,5,.6);}

/* ==================== 对局界面 ==================== */
#view-game{z-index:1;display:flex;flex-direction:column;}
/* 顶部AI席 */
.ai-bench{display:flex;justify-content:center;gap:clamp(6px,1.4vw,18px);padding:8px 10px 4px;flex-wrap:nowrap;}
.seat{width:clamp(108px,16vw,158px);background:linear-gradient(180deg,rgba(38,24,13,.92),rgba(22,13,7,.94));
  border:2px solid #5d4322;border-radius:8px;padding:6px;position:relative;transition:border-color .2s,box-shadow .2s;flex-shrink:0;}
.seat.active{border-color:var(--gold-bright);box-shadow:0 0 14px rgba(240,212,154,.55);}
.seat.targetable{border-color:#e06a4a;box-shadow:0 0 14px rgba(224,106,74,.7);cursor:crosshair;animation:pulseTarget 1s infinite;}
.seat.dead{filter:grayscale(1) brightness(.5);}
/* 统一读秒条：
   元素写在 seatHTML / playerPanelHTML 模板里（默认隐藏，靠 .on 显现），这样哪怕 UI.render()
   整片重建席位，进度条也一定在；paintTimerBars() 只改 class 和 width，绝不增删节点。 */
.turn-bar-wrap{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(0,0,0,.55);
  border-radius:0 0 5px 5px;z-index:7;pointer-events:none;display:none;}
.turn-bar-wrap.on{display:block;}
.turn-bar{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffce6a,#ff9f45);
  border-radius:0 0 0 5px;transition:width .12s linear;}
.turn-bar.urgent{background:linear-gradient(90deg,#ff7a45,#e02d1a);}
.turn-sec{position:absolute;right:3px;top:-14px;font-size:10px;color:#ffd98a;background:rgba(0,0,0,.62);
  padding:0 4px;border-radius:3px;line-height:13px;letter-spacing:0;white-space:nowrap;}
/* 本机玩家面板上的同一条读秒（自己出牌 / 自己被要求响应时） */
.gp-turnbar{position:relative;height:6px;margin:4px 0 0;background:rgba(0,0,0,.55);
  border-radius:3px;display:none;}
.gp-turnbar.on{display:block;}
.gp-turnbar .turn-bar{border-radius:3px;}
.gp-turnbar .turn-sec{right:2px;top:-13px;}
@keyframes pulseTarget{50%{box-shadow:0 0 22px rgba(224,106,74,.95);}}
.seat-top{display:flex;gap:6px;align-items:flex-start;}
.seat-avatar{width:clamp(40px,6vw,54px);height:clamp(40px,6vw,54px);border-radius:5px;object-fit:cover;
  border:1.5px solid #7a5c30;background:#222;flex-shrink:0;}
.seat-info{flex:1;min-width:0;}
.seat-name{font-family:var(--brush);font-size:clamp(16px,2.2vw,21px);line-height:1.1;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.seat-name .km{font-size:9px;padding:0 4px;border-radius:2px;color:#fff;letter-spacing:1px;}
.seat-hp{display:flex;flex-wrap:wrap;gap:1px;margin-top:3px;}
.jade{width:11px;height:11px;background:radial-gradient(circle at 35% 30%,#ff8a7a,#b3261c 70%,#7c130c);
  border-radius:60% 60% 60% 10%;transform:rotate(-45deg);box-shadow:0 1px 2px rgba(0,0,0,.5);}
.jade.lost{background:#3a2a20;box-shadow:none;}
.seat-meta{display:flex;align-items:center;gap:5px;margin-top:4px;min-height:18px;flex-wrap:wrap;}
.hand-count{font-size:11px;color:#cdb784;background:rgba(0,0,0,.4);border:1px solid #6b5028;border-radius:9px;padding:0 7px;line-height:16px;}
.identity-badge{font-size:10px;padding:0 5px;border-radius:3px;font-weight:700;letter-spacing:1px;color:#221408;}
.id-lord{background:#f0c04a;} .id-loyal{background:#7fc3e8;} .id-rebel{background:#e06a4a;color:#fff;} .id-renegade{background:#b08fd0;color:#fff;}
.judge-tags{display:flex;gap:3px;}
.judge-tag{font-size:10px;padding:0 4px;border-radius:3px;font-weight:700;}
.tag-le{background:#8a5a20;color:#ffe9c0;} .tag-bing{background:#5a6a3a;color:#e8f0d0;}
.tag-flip{background:#4a3a6a;color:#e0d4ff;} .tag-mao{background:#6a5a2a;color:#fff3c0;}
.tag-dist{background:#2a4a5a;color:#cfeeff;}
.seat.flipped .seat-avatar{transform:rotate(180deg);filter:grayscale(.6) brightness(.75);}
.seat.flipped{box-shadow:0 0 8px #7a5adf66 inset;}
.equip-row{display:flex;gap:3px;margin-top:5px;}
.eq-slot{flex:1;height:17px;border:1px dashed #6b5028;border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-size:9px;color:#b09463;overflow:hidden;background:rgba(0,0,0,.28);text-align:center;line-height:1;}
.eq-slot.filled{border-style:solid;border-color:#8a9f9a;background:linear-gradient(180deg,#3c5550,#263835);color:#bfe0d8;font-weight:700;}
.seat-skill-tags{margin-top:4px;font-size:10px;color:#9fb0a8;line-height:1.4;min-height:14px;}

/* 中央战场 */
.arena{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:0;padding:4px 10px;}
.deck-area{display:flex;gap:18px;align-items:center;margin-bottom:6px;}
.deck-pile{width:54px;height:74px;border-radius:6px;border:2px solid #8a6a36;
  background:linear-gradient(135deg,#6e1d16,#43100c);display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--gold-bright);font-size:11px;position:relative;box-shadow:var(--shadow);}
.deck-pile .big{font-family:var(--brush);font-size:24px;}
.deck-pile.discard{background:linear-gradient(135deg,#3a2c18,#241a0e);}
.deck-pile .cnt{position:absolute;bottom:2px;right:4px;font-size:12px;font-weight:700;color:#f0d49a;}
.phase-banner{font-size:14px;letter-spacing:3px;color:var(--gold-bright);background:rgba(20,12,6,.7);
  border:1px solid rgba(201,163,92,.4);border-radius:16px;padding:3px 16px;margin-bottom:6px;}
.log-box{width:min(560px,92%);max-height:26%;overflow-y:auto;background:rgba(15,9,4,.62);
  border:1px solid rgba(201,163,92,.25);border-radius:6px;padding:7px 12px;font-size:13px;line-height:1.7;}
.log-box p{color:#d3bd8c;}
.log-box p.imp{color:#ffd98a;font-weight:700;}
.log-box p .ln-kingdom-wei{color:#9cc2ee;} .log-box p .ln-kingdom-shu{color:#f0a08e;}
.log-box p .ln-kingdom-wu{color:#92d6ae;} .log-box p .ln-kingdom-qun{color:#d8c89e;}
.log-box p .ln-card{color:var(--gold-bright);font-weight:700;}
/* 中央判定区 */
.judge-zone{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:24px;margin:2px 0 6px;}
.judge-chip{display:flex;align-items:center;gap:5px;background:rgba(20,12,6,.78);border:1px solid rgba(201,163,92,.4);
  border-radius:14px;padding:2px 10px 2px 6px;font-size:11px;color:#e6cf9c;}
.judge-chip .jc-card{width:22px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;}
.judge-chip .jc-le{background:linear-gradient(135deg,#7a2a6a,#4d1743);}
.judge-chip .jc-bing{background:linear-gradient(135deg,#8a6a2a,#5a4416);}
/* ============ 特效层（箭头/飞牌） ============ */
#fx-layer{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden;}
.fx-arrow{position:absolute;height:0;pointer-events:none;transform-origin:0 0;}
.fx-line{position:absolute;left:0;top:-3px;width:100%;height:6px;border-radius:3px;
  background:linear-gradient(90deg,rgba(255,90,60,.05),#ff5a3c 55%,#ffe2b0);
  box-shadow:0 0 12px rgba(255,90,60,.9),0 0 4px rgba(255,220,160,.9);
  transform:scaleX(0);transform-origin:left center;animation:fxDraw .26s ease-out forwards;}
.fx-head{position:absolute;right:-14px;top:-11px;width:0;height:0;
  border-left:15px solid #ff7a4d;border-top:11px solid transparent;border-bottom:11px solid transparent;
  filter:drop-shadow(0 0 6px rgba(255,90,60,.95));opacity:0;animation:fxHead .2s ease-out .18s forwards;}
.fx-dart{position:absolute;left:0;top:-5px;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#ffd2a0 40%,rgba(255,120,60,0) 72%);
  animation:fxDart .34s cubic-bezier(.5,.05,.6,1) forwards;}
.fx-arrow.fade{opacity:0;transition:opacity .28s ease;}
@keyframes fxDraw{to{transform:scaleX(1);}}
@keyframes fxHead{to{opacity:1;}}
@keyframes fxDart{from{left:0;opacity:1;}to{left:calc(100% - 12px);opacity:.25;}}
.fly-card{position:absolute;width:42px;height:58px;border-radius:5px;z-index:41;pointer-events:none;
  background:linear-gradient(135deg,#7c2119,#4a120c);border:1.5px solid #b08a4a;
  box-shadow:0 3px 10px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;
  color:#e8c878;font-family:var(--brush);font-size:20px;will-change:transform,opacity;}
.fly-card::after{content:"殺";}
/* 打出卡牌实体飞行 */
.fx-playcard{position:absolute;z-index:42;pointer-events:none;will-change:transform,opacity;
  transition:transform .45s cubic-bezier(.35,.05,.35,1),opacity .3s ease;}
.fx-playcard .card{margin:0!important;box-shadow:0 8px 20px rgba(0,0,0,.65);animation:none!important;}
.fx-playcard.fade{opacity:0;}
/* 响应牌（闪/杀响应）在角色面前弹出 */
.fx-respond{position:absolute;z-index:42;pointer-events:none;will-change:transform,opacity;
  animation:respPop .95s ease forwards;}
.fx-respond .card{margin:0!important;box-shadow:0 6px 16px rgba(0,0,0,.6);animation:none!important;}
@keyframes respPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}
  72%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-82%) scale(.92);}}
/* ============ 5人局：四角环绕布局 ============ */
#view-game.surround .ai-bench{position:absolute;top:10px;left:16px;right:16px;bottom:214px;
  display:block;pointer-events:none;padding:0;z-index:3;}
#view-game.surround .ai-bench .seat{position:absolute;pointer-events:auto;margin:0;
  width:clamp(138px,15.5vw,176px);}
/* 座位号映射（顺时针）：轮到我之后的第 1/2/3/4 家依次落在 右中→右上→左上→左中，
   于是「我 → 右 → 右上 → 左上 → 左 → 回我」在屏幕上是逆时针推进（三国杀标准轮转）。
   注意：这里只改屏幕落位，不改座位序号；nth-child(1..4) 仍然严格对应 +1..+4，
   所以「屏幕上挨着你的」和「牌序上挨着你的」依然是同一家，距离不会错位。 */
#view-game.surround .ai-bench .seat:nth-child(1){top:47%;right:0;transform:translateY(-50%);}
#view-game.surround .ai-bench .seat:nth-child(2){top:12px;right:13.5%;}
#view-game.surround .ai-bench .seat:nth-child(3){top:12px;left:13.5%;}
#view-game.surround .ai-bench .seat:nth-child(4){top:47%;left:0;transform:translateY(-50%);}
#view-game.surround .ai-bench .seat:nth-child(1).targetable,
#view-game.surround .ai-bench .seat:nth-child(4).targetable{transform:translateY(-50%);}
#view-game.surround .arena{z-index:1;}
#view-game.surround .player-dock{position:relative;z-index:5;}
/* 浮动战报 */
.floats{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:5;}
.float-word{font-family:var(--brush);font-size:clamp(40px,7vw,72px);color:#f3d896;text-shadow:0 0 18px rgba(0,0,0,.9),0 3px 4px #000;
  animation:floatUp 1.5s ease forwards;letter-spacing:10px;}
.float-word.hit{color:#ff7a5c;} .float-word.heal{color:#8fdca0;} .float-word.info{color:#bcd6ee;font-size:clamp(26px,4vw,40px);}
@keyframes floatUp{0%{opacity:0;transform:translateY(18px) scale(.7);}18%{opacity:1;transform:none;}
  75%{opacity:1;}100%{opacity:0;transform:translateY(-46px) scale(1.08);}}

/* 玩家区 */
.player-dock{background:linear-gradient(0deg,rgba(16,9,4,.97),rgba(26,16,8,.82));
  border-top:2px solid rgba(201,163,92,.35);padding:6px 10px 8px;}
.tip-line{font-size:12px;color:#e8b860;text-align:center;min-height:16px;letter-spacing:1px;margin-bottom:2px;}
.player-main{display:flex;gap:12px;align-items:flex-end;}
.general-panel{width:clamp(118px,17vw,158px);flex-shrink:0;background:linear-gradient(180deg,#2e1d0f,#1b0f07);
  border:2px solid #7a5c30;border-radius:8px;padding:6px;position:relative;}
.general-panel img{width:100%;height:clamp(62px,9vw,84px);object-fit:cover;object-position:top center;border-radius:5px;display:block;}
.general-panel .gp-name{font-family:var(--brush);font-size:clamp(17px,2.2vw,22px);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.general-panel .gp-hp{display:flex;flex-wrap:wrap;gap:2px;margin:3px 0;}
.general-panel .gp-hp .jade{width:12px;height:12px;}
.skill-btns{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;}
.skill-btn{font-size:11px;padding:2px 6px;border-radius:4px;background:linear-gradient(180deg,#5a4020,#3c2812);
  border:1px solid var(--gold-deep);color:var(--gold-bright);letter-spacing:1px;line-height:1.5;}
.skill-btn:hover{filter:brightness(1.2);}
.skill-btn.off{opacity:.6;pointer-events:none;}
.skill-btn.sk-off{opacity:.62;}
.skill-btn .sk-cnt{font-size:10px;opacity:.85;font-weight:400;}
.sd-item{background:rgba(20,12,6,.6);border:1px solid rgba(201,163,92,.28);border-radius:6px;padding:8px 10px;margin:7px 0;text-align:left;}
.sd-name{font-family:var(--brush);font-size:19px;color:var(--gold-bright);letter-spacing:2px;}

.sd-desc{font-size:13px;line-height:1.65;color:#d8c49a;margin-top:3px;}

.sd-head{display:flex;gap:12px;align-items:center;margin-bottom:8px;}

.help-steps{text-align:left;font-size:14px;line-height:1.9;color:#d8c49a;margin:8px 4px;}

.hand-zone{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;}
.hand-cards{display:flex;justify-content:center;align-items:flex-end;min-height:118px;flex-wrap:nowrap;overflow-x:auto;
  padding:14px 6px 4px;width:100%;}
.hand-cards .card{margin:0 var(--hm,-13px);flex-shrink:0;}
.hand-cards .card:hover{margin-top:-22px;z-index:8;}
.hand-cards .card.playable{box-shadow:0 0 10px rgba(240,212,154,.65),var(--shadow);}
.hand-cards .card.playable:hover{box-shadow:0 0 20px rgba(240,212,154,.9);}
.hand-cards .card.picked-card{margin-top:-26px;z-index:9;box-shadow:0 0 18px rgba(240,212,154,.95),var(--shadow);}
.side-panel{width:clamp(104px,15vw,142px);flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
.side-panel .eq-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.side-panel .eq-slot{height:30px;font-size:10px;flex:none;}
.dock-actions{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.dock-actions .btn{padding:9px 8px;font-size:14px;letter-spacing:2px;}
.tip-line{font-size:12px;color:#e8b860;text-align:center;letter-spacing:1px;}

/* ==================== 卡牌 ==================== */
.card{width:78px;height:108px;border-radius:6px;position:relative;cursor:pointer;
  background:linear-gradient(160deg,#f6eccf,#e3cf9e 60%,#d4b97e);
  border:1.5px solid #8a6a36;box-shadow:var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;transition:transform .13s,box-shadow .13s,margin .13s;}
.card.type-trick{background:linear-gradient(160deg,#f3e2a6,#e0c268 60%,#c6a244);}
.card.type-equip{background:linear-gradient(160deg,#dcece7,#aecfc6 60%,#8fb4ab);}
.card .corner{position:absolute;top:3px;left:5px;font-weight:900;font-size:14px;line-height:1.05;text-align:center;}
.card .corner .rank{display:block;font-size:16px;}
.card .corner.red{color:var(--red-suit);} .card .corner.black{color:var(--black-suit);}
.card .cname{font-family:var(--brush);font-size:21px;text-align:center;margin-top:16px;color:#3a2410;letter-spacing:1px;}
.card.type-trick .cname{font-size:18px;}
.card .cart{flex:1;display:flex;align-items:center;justify-content:center;font-size:34px;color:rgba(70,45,18,.55);}
.card .csub{text-align:center;font-size:9px;color:#6b4a24;padding-bottom:4px;letter-spacing:1px;}
.card.red-name .cname{color:#8e1f1a;}
.card.back{background:linear-gradient(135deg,#7a2118,#4a110c 60%,#360b07);border-color:#a8763a;cursor:default;}
.card.back::before{content:"殺";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--brush);font-size:38px;color:rgba(232,200,126,.85);text-shadow:0 0 8px rgba(0,0,0,.6);}
.card.back::after{content:"";position:absolute;inset:5px;border:1.5px solid rgba(217,184,106,.55);border-radius:4px;}
.card.small{width:52px;height:73px;}
.card.small .cname{font-size:14px;margin-top:11px;} .card.small .cart{font-size:22px;}
.card.small .corner{font-size:10px;} .card.small .corner .rank{font-size:12px;}
.card.small .csub{font-size:7px;}
.card.selectable{outline:3px solid #e8b860;outline-offset:1px;animation:pulseTarget .9s infinite;}
.card.virtual{outline:2px dashed #7fa8d8;}
.card.used-dim{opacity:.42;}
/* 花色符号 */
.suit-sym{font-family:serif;}

/* ==================== 弹窗 ==================== */
#modal-layer{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-mask{position:absolute;inset:0;background:rgba(8,4,1,.72);backdrop-filter:blur(2px);}
.modal-box{position:relative;width:min(680px,94vw);max-height:92vh;overflow-y:auto;
  background:linear-gradient(180deg,#33200f,#211409);border:2px solid var(--gold);border-radius:10px;
  box-shadow:0 18px 60px rgba(0,0,0,.75);padding:22px 24px;animation:modalIn .22s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(14px);}to{opacity:1;transform:none;}}
.modal-box h3{font-family:var(--brush);font-size:28px;color:var(--gold-bright);letter-spacing:4px;text-align:center;margin-bottom:6px;}
.modal-box .m-desc{text-align:center;font-size:14px;color:#d3bd8c;line-height:1.7;margin-bottom:14px;}
.modal-box .m-desc b{color:#ffd98a;}
.modal-actions{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
.pick-cards{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:10px 0;}
.pick-cards .card{cursor:pointer;transition:transform .1s;}
.pick-cards .card:hover{transform:translateY(-6px);}
.pick-cards .card.picked{transform:translateY(-10px);box-shadow:0 0 0 2px var(--gold-bright),var(--shadow);}
.pick-seats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.pick-seat{width:118px;border:2px solid #5d4322;border-radius:8px;padding:6px;background:#241509;cursor:pointer;text-align:center;transition:all .12s;}
.pick-seat:hover{border-color:var(--gold);transform:translateY(-3px);}
.pick-seat img{width:100%;height:96px;object-fit:cover;object-position:top center;border-radius:5px;}
.pick-seat .pn{font-family:var(--brush);font-size:20px;margin-top:4px;}
.judge-reveal{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px 0;}
.judge-reveal .judge-label{font-size:13px;color:#b89d6b;letter-spacing:2px;}
.guanxing-area{display:flex;flex-direction:column;gap:12px;}
.guanxing-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:118px;padding:10px;border:1px dashed #6b5028;border-radius:8px;}

/* 结果界面 */
.result-emph{font-family:var(--brush);font-size:clamp(44px,8vw,76px);text-align:center;letter-spacing:16px;margin:8px 0 4px;}
.result-emph.win{color:#f0d49a;text-shadow:0 0 30px rgba(240,212,154,.6);}
.result-emph.lose{color:#d06a52;text-shadow:0 0 30px rgba(208,106,82,.5);}
.result-detail{text-align:center;font-size:14px;color:#cbb487;line-height:2;margin-bottom:8px;}
.id-reveal-list{display:flex;flex-direction:column;gap:6px;margin:12px auto;max-width:380px;}
.id-reveal-list div{display:flex;justify-content:space-between;background:rgba(0,0,0,.3);border:1px solid #5d4322;border-radius:6px;padding:7px 14px;font-size:14px;}

/* Toast */
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:99;pointer-events:none;

#toast.show{opacity:1;transform:translateX(-50%) translateY(6px);}

/* ==================== 图鉴 ==================== */
#view-codex{z-index:1;background:linear-gradient(180deg,#1c1108,#120a05);display:flex;flex-direction:column;}
.codex-tabs{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap;}
.codex-tab{padding:9px 18px;background:#2c1c0e;border:1px solid #5d4322;border-bottom:none;border-radius:8px 8px 0 0;
  color:#b89d6b;font-size:15px;letter-spacing:2px;font-weight:700;}

.codex-body{flex:1;overflow-y:auto;padding:18px 22px;margin:0 16px 16px;border:1px solid #5d4322;border-radius:0 8px 8px 8px;background:rgba(20,12,6,.55);}

.codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}

.codex-card{background:#261709;border:1px solid #5d4322;border-radius:8px;padding:10px;}
.codex-card .cc-name{font-family:var(--brush);font-size:21px;color:var(--gold-bright);display:flex;justify-content:space-between;align-items:center;}
.codex-card .cc-name .cnt{font-family:var(--serif);font-size:12px;color:#b89d6b;}
.codex-card .cc-desc{font-size:12px;color:#cbb487;line-height:1.6;margin-top:6px;}
.codex-card .cc-suit{font-size:11px;color:#9a8258;margin-top:4px;}
.codex-general{display:flex;gap:12px;background:#261709;border:1px solid #5d4322;border-radius:8px;padding:10px;}

.codex-general .cg-info{min-width:0;}

.codex-general .cg-skills{font-size:12px;color:#cbb487;line-height:1.6;margin-top:4px;}

.codex-backbar{padding:10px 16px;}

"use strict";
/* ==================== 工具函数 ==================== */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
let UID=1; const nid=()=>UID++;
function assetImg(id){
  const el=document.querySelector('img[data-asset="'+id+'"]');
  if(el)return el.src;
  /* 兜底：预加载列表里没有该武将时直接拼路径，避免头像 src 为空显示破图 */
  return 'assets/images/'+id+'.jpg';
}
/* 设置 innerHTML 但复用已有头像节点（同一武将），避免频繁 render 时头像重新加载闪烁 */
function setHTMLKeepAvatar(el,html){
  /* 【性能短路】UI.render() 一个回合会被调用几十次，而绝大多数时候座位的 HTML 一字未变。
     以前每次都整段重设 innerHTML 再把头像 img 换回来，白白触发几十次 DOM 解析 + 重排，
     这是「玩着卡」最主要的本机开销。内容没变就一个节点都不动。 */
  if(el._lastHTML===html)return;
  el._lastHTML=html;
  const old={};
  el.querySelectorAll('img[data-gid]').forEach(i=>old[i.dataset.gid+'|'+(i.dataset.form||'')]=i);
  el.innerHTML=html;
  el.querySelectorAll('img[data-gid]').forEach(i=>{
    const c=old[i.dataset.gid+'|'+(i.dataset.form||'')];
    if(c){
      /* 形态切换（张峥·二次元 / 张嵘·觉醒）时头像要跟着换，否则节点被复用导致形象不变 */
      if(c.src!==i.src)c.src=i.src;
      i.replaceWith(c);
    }
  });
}
function suitColor(s){return (s==='♥'||s==='♦')?'red':'black';}

  SLEEP_SCALE=fast?0.4:0.9;

  const b=document.getElementById('btn-speed');if(b)b.textContent='AI节奏：'+(fast?'快速':'慢速');
  toast(fast?'AI 已切换为快速出牌':'AI 已切换为慢速出牌（默认）');
}

/* 装备槽显示文案：要让人看清「装的是什么」——武器名 / 防具名 / +1马·名 / -1马·名 */
function equipSlotTxt(slot,c){
  if(!c)return '';
  if(slot==='weapon')return '武·'+c.name;
  if(slot==='armor')return '防·'+c.name;
  if(slot==='horse+')return '+1马·'+c.name;
  return '-1马·'+c.name;
}
function P(seat){return G.players.find(p=>p.seat===seat);}
function human(){return G.players.find(p=>p.local)||G.players.find(p=>!p.isAI&&!p.remote);}
function aliveList(){return G.players.filter(p=>p.alive);}
function othersAlive(p){return G.players.filter(q=>q.alive&&q!==p);}
/* 翻面（定燕子朝天）状态下所有技能失效 */
function hasSkill(p,key){
  if(!p||p.flipped||p.alive===false)return false;
  const g=GENERAL_MAP[p.gid];if(!g)return false;
  const s=g.skills.find(x=>x.key===key);if(!s)return false;
  /* 觉醒后解锁的技能（张嵘·自强/梭哈）：觉醒前视为不拥有 */
  if(s.type==='locked'&&!(p.skillUnlocked&&p.skillUnlocked[key]))return false;
  /* 觉醒后失效的技能（张嵘·舔狗/封心） */
  if(p.awakened&&(key==='tiangou'||key==='fengxin'))return false;
  return true;
}
/* 当前应显示的头像（张峥二次元 / 张嵘觉醒 会换形象） */
function formTag(p){return p?(p.nijigen?'n2':(p.awakened?'aw':'')):'';}
function avatarImg(p){
  const g=p?GENERAL_MAP[p.gid]:null;if(!g)return '';
  if(g.img2&&((g.id==='zhangzheng'&&p.nijigen)||(g.id==='zhangrong'&&p.awakened)))return assetImg(g.img2);
  return assetImg(g.img);
}
function skillName(p,key){const s=GENERAL_MAP[p.gid].skills.find(s=>s.key===key);return s?s.name:key;}
function generalOf(p){return GENERAL_MAP[p.gid];}

   这里先把 audio / 头像全部预载完，再放行进入主菜单。 */
const Loader={
  total:0,done:0,finished:false,_started:false,

    if(this._started)return;this._started=true;

      .concat([].slice.call(document.querySelectorAll('img[data-asset]')))
      .filter(e=>e&&e.getAttribute('src'));
    this.total=els.length;
    if(!this.total){this.finish();return;}
    const counted=new Set();
    const bump=el=>{if(counted.has(el))return;counted.add(el);this.done++;this.paint();};
    els.forEach(el=>{
      const isAudio=el.tagName==='AUDIO';
      const ready=isAudio?(el.readyState>=3):(el.complete&&el.naturalWidth>0);
      if(ready){bump(el);return;}
      const h=()=>bump(el);
      if(isAudio){
        ['canplay','canplaythrough','loadeddata'].forEach(ev=>el.addEventListener(ev,h,{once:true}));
        el.addEventListener('error',h,{once:true});
        try{el.preload='auto';el.load();}catch(e){}

    setTimeout(()=>{const b=document.getElementById('boot-skip');if(b)b.classList.remove('hidden');},600);
    setTimeout(()=>this.finish(),9000);   /* 硬兜底：最多等 9 秒必须放行 */
    /* 最后一道保险：无论如何 20 秒后强制移除遮罩。
       这条绝不能删 —— 全屏遮罩吃点击会导致「什么都点不了」的致命故障 */
    setTimeout(()=>{
      try{const b=document.getElementById('boot');
        if(b){b.classList.add('done');setTimeout(()=>{try{b.remove();}catch(e){}},200);}}catch(e){}

  respondCard(p,card,vname,via){
    if(typeof NET!=='undefined'&&NET.hostActive)NET.broadcast({k:'fx',fx:'respond',a:[p.seat,card,vname||null,via||null]});
    const fx=document.getElementById('fx-layer');if(!fx||!card)return;
    const el=this.elOf(p);if(!el)return;
    const C=this.center(el,fx);
    const small=window.innerWidth<=640;
    const wrap=document.createElement('div');wrap.className='fx-respond';
    wrap.innerHTML=cardEl(card,{small,name:vname,via});
    wrap.style.left=C.x+'px';wrap.style.top=(C.y-44)+'px';
    fx.appendChild(wrap);
    setTimeout(()=>wrap.remove(),960);
  }
};

/* ---------- 牌堆操作 ---------- */
function takeDeck(n){
  const out=[];
  for(let i=0;i<n;i++){
    if(G.deck.length===0){
      if(G.discardPile.length===0) break;
      G.deck=shuffle(G.discardPile); G.discardPile=[];
      log('牌堆已重洗',true);
    }
    out.push(G.deck.pop());
  }
  UI.renderPiles();return out;
}
async function drawCards(p,n,reason){
  const cs=takeDeck(n);
  p.hand.push(...cs);
  log(`${nameHTML(p)} 摸了 ${cs.length} 张牌${reason?'（'+reason+'）':''}`);
  UI.render();FX.flyCard(p,cs.length);return cs;
}
function toDiscard(card){
  // 从任何区域移除并进入弃牌堆
  for(const p of G.players){
    let i=p.hand.findIndex(c=>c.uid===card.uid);
    if(i>=0){p.hand.splice(i,1);G.discardPile.push(card);return card;}
    for(const slot in p.equips){if(p.equips[slot]&&p.equips[slot].uid===card.uid){p.equips[slot]=null;G.discardPile.push(card);return card;}}
    i=p.judges.findIndex(c=>c.uid===card.uid);
    if(i>=0){p.judges.splice(i,1);G.discardPile.push(card);return card;}
  }
  // 可能在暂存（判定牌等）
  G.discardPile.push(card);return card;
}
function findCardAnywhere(uid){
  for(const p of G.players){
    if(p.hand.some(c=>c.uid===uid))return{place:'hand',p};
    for(const slot in p.equips)if(p.equips[slot]&&p.equips[slot].uid===uid)return{place:'equip',p,slot};
    if(p.judges.some(c=>c.uid===uid))return{place:'judges',p};
  }
  if(G.discardPile.some(c=>c.uid===uid))return{place:'discard'};
  return null;
}
function equipCard(p,card){
  const slot=card.slot;
  if(p.equips[slot]){const old=p.equips[slot];G.discardPile.push(old);log(`${nameHTML(p)} 的 ${old.name} 被替换`);}
  p.equips[slot]=card;
  log(`${nameHTML(p)} 装备了 ${cardHTML(card)}`);
}
function handCard(p,card){ // 获得一张牌到手牌
  const loc=findCardAnywhere(card.uid);
  if(!loc)return;
  if(loc.place==='discard'){const i=G.discardPile.findIndex(c=>c.uid===card.uid);G.discardPile.splice(i,1);}
  else if(loc.place==='hand'){loc.p.hand.splice(loc.p.hand.findIndex(c=>c.uid===card.uid),1);}
  else if(loc.place==='equip'){loc.p.equips[loc.slot]=null;}
  else if(loc.place==='judges'){loc.p.judges.splice(loc.p.judges.findIndex(c=>c.uid===card.uid),1);}
  p.hand.push(card);
}

/* ---------- 距离与攻击范围 ---------- */
function seatDist(a,b){
  /* 距离按「存活玩家围成的圈」计算：阵亡玩家不占位，直接跳过 */
  const alive=G.players.filter(p=>p.alive).map(p=>p.seat).sort((x,y)=>x-y);
  const i=alive.indexOf(a.seat),j=alive.indexOf(b.seat);
  if(i<0||j<0)return 99;
  const n=alive.length,d=Math.abs(i-j);
  return Math.min(d,n-d);
}
function distance(a,b){
  let d=seatDist(a,b);
  if(a.equips['horse-'])d--;
  if(b.equips['horse+'])d++;
  return Math.max(1,d);
}
/* 牌桌显示顺序（注意：别和上面的 seatOrderFrom(s) 混了，那个返回的是「从 s 起的存活玩家数组」）：
   这里返回一个排序键函数，以本机为起点绕桌一圈（我+1、我+2……）。
   屏幕上的位置必须和座号环一致，否则屏幕邻居 ≠ 座号邻居：
   典型症状是「顺手牵羊牵不到挨着自己的那个人」。 */
function tableOrderIndex(me){const n=G.players.length||1;return p=>((p.seat-(me?me.seat:0))+n)%n;}
function attackRange(p){return p.equips.weapon?p.equips.weapon.range:1;}
function canReach(a,b){return distance(a,b)<=attackRange(a);}
function validShaTargets(p){
  return othersAlive(p).filter(q=>{
    if(hasSkill(q,'kongcheng')&&q.hand.length===0)return false;
    return canReach(p,q);
  });
}

/* ---------- 身份阵营 ---------- */
function identityOf(p){return p.identity;}
function sameSide(a,b){
  if(G.mode!=='identity')return false;
  if(!a.identity||!b.identity)return false;
  if(a.identity==='renegade'||b.identity==='renegade')return false;
  if((a.identity==='lord'||a.identity==='loyal')&&(b.identity==='lord'||b.identity==='loyal'))return true;
  if(a.identity==='rebel'&&b.identity==='rebel')return true;
  return false;
}
function alliesOf(p){return othersAlive(p).filter(q=>sameSide(p,q));}
function enemiesOf(p){
  if(G.mode==='duel')return othersAlive(p);
  return othersAlive(p).filter(q=>!sameSide(p,q));
}

/* ==================== 开局 ==================== */
function startGame(mode,gid){
  G.mode=mode;G.over=false;G.turnCount=0;G.log=[];G.discardPile=[];G.helpShown=false;
  G.round=null;G.roundStartSeat=0;   /* 单机起始位恒为 0 号座（主公位） */
  UID=1;G.deck=buildDeck();
  const mk=(seat,gid0,isAI,identity)=>({
    seat,gid:gid0,isAI,identity,
    hp:GENERAL_MAP[gid0].hp,maxHp:GENERAL_MAP[gid0].hp,
    hand:[],equips:{weapon:null,armor:null,'horse+':null,'horse-':null},
    judges:[],alive:true,usedSha:0,drank:false,skillUsed:{},skillCount:{},
    skipDraw:false,skipPlay:false,revealed:false
  });
  const humanP=mk(0,gid,false,mode==='identity'?'lord':null);
  humanP.local=true;
  G.players=[humanP];
  if(mode==='duel'){
    const aiPool=shuffle(PLAYABLE_IDS.filter(x=>x!==gid));
    G.players.push(mk(1,aiPool[0],true,null));
  }else{
    const aiPool=shuffle(PLAYABLE_IDS.filter(x=>x!==gid));
    const ids=shuffle(['loyal','rebel','rebel','renegade']);
    for(let i=1;i<=4;i++)G.players.push(mk(i,aiPool[i-1],true,ids[i-1]));
    humanP.maxHp++;humanP.hp=humanP.maxHp; // 主公体力上限+1
  }
  // 起手手牌
  for(const p of G.players)p.hand.push(...takeDeck(4));
  $('#view-menu').classList.add('hidden');
  $('#view-select').classList.add('hidden');
  $('#view-codex').classList.add('hidden');
  $('#view-game').classList.remove('hidden');
  $('#view-game').classList.toggle('surround',mode==='identity');
  $('#fx-layer').innerHTML='';
  SFX.unlock();SFX.startBgm();
  try{UI.showChat(true);}catch(e){}   /* 单机也是同一套视图，聊天框要显式放行才看得到 */
  UI.render();
  log(mode==='duel'?'一将单挑开始！':'五人身份局开始，你是<span class="ln-kingdom-qun">主公</span>！',true);
  if(mode==='identity')log('忠臣护你，反贼欲杀你，内奸坐收渔利——辨明忠奸',true);
  gameLoop();
}

/* ==================== 回合主循环 ==================== */
async function gameLoop(){
  await sleep(600);
  while(!G.over){
    const p=P(G.turnSeat);
    /* 新一轮开始（回到起始位=主公位，或首回合）：触发公演等「每轮开始」效果 */
    if(p.seat===G.roundStartSeat||G.round==null){await roundStart();if(G.over)break;}
    if(!p.alive){G.turnSeat=nextSeat(G.turnSeat);continue;}
    G.turnCount++;
    await runTurn(p);
    if(G.over)break;
    G.turnSeat=nextSeat(G.turnSeat);
  }
}

/* ==================== 每轮开始（杨浩展·公演 等「每轮」效果） ==================== */
async function roundStart(){
  G.round=(G.round||0)+1;
  if(G.round>1)log(`—— 第 ${G.round} 轮 ——`,true);
  for(const p of G.players){
    if(!p.alive||!hasSkill(p,'gy'))continue;
    /* 游戏开始时获得 3 个麦克风（第一轮初始化） */
    if(p.mic==null){p.mic=3;log(`${nameHTML(p)}【公演】开场获得 3 个「麦克风」🎤`,true);}
    /* Dance 的麦克风已改为「出牌阶段结束即刻结算」（见 settleDanceMic，由 runTurn 调用）。
       这里只做兜底：万一某角色的出牌阶段被整体跳过而没走到结算点，下一轮开始时补发，
       避免 p.dance 永久挂着不结算。settleDanceMic 内部会清标志，不会重复发两次。 */
    if(p.dance)settleDanceMic(p);
    /* 清掉上一轮的演出效果 */
    p.vocal=false;p.vocalUsed=false;p.rapDmg=false;
    const choice=await chooseGy(p);
    if(choice)applyGy(p,choice);
  }
  UI.render();
}
/* 公演三选一（人机/本地/远程三路） */
async function chooseGy(p){
  const opts=[
    {k:'vocal',t:'Vocal',cost:1,desc:'弃 1 麦克风：从牌堆随机获得一张【桃】；本轮你于回合内首次成为基本牌的目标时，摸一张牌'},
    {k:'rap',t:'Rap',cost:2,desc:'弃 2 麦克风：本轮你造成的伤害+1'},
    {k:'dance',t:'Dance',cost:0,desc:'回复 1 点体力；随机从牌堆装备一张防具牌和防御马牌；本轮结束后获得随机 0~2 个麦克风'},
  ];
  let k;
  if(p.isAI){
    k=aiChooseGy(p);
    log(`${nameHTML(p)}【公演】选择了『${opts.find(o=>o.k===k).t}』`);
  }else{
    const acts=opts.map(o=>({v:o.k,t:`${o.t}${o.cost?`（弃${o.cost}🎤）`:''}`,disabled:p.mic<o.cost}));
    const desc=opts.map(o=>`『${o.t}』${o.desc}`).join('<br>')+`<br><b>当前麦克风：${p.mic} 个</b>`;
    k=p.remote?await NET.askRemote(p,'chooseAction',['公演 · 选择本轮演出',acts,desc])
             :await UI.chooseAction('公演 · 选择本轮演出',acts,desc);
    if(!opts.some(o=>o.k===k&&p.mic>=o.cost))k=p.mic>=1?'vocal':'dance';   /* 兜底 */
  }
  return k;
}
function aiChooseGy(p){
  if(p.mic>=2){
    const foes=enemiesOf(p);
    if(foes.some(q=>q.hp<=2)||p.hp>=p.maxHp)return 'rap';
  }
  if(p.hp<p.maxHp)return 'dance';
  if(p.mic>=1)return 'vocal';
  return 'dance';
}
function applyGy(p,k){
  if(k==='vocal'){
    p.mic--;p.vocal=true;SFX.skill('gy_vocal');
    const idxs=[];G.deck.forEach((c,i)=>{if(c.name==='桃')idxs.push(i);});
    if(idxs.length){
      const i=idxs[Math.floor(Math.random()*idxs.length)];
      const c=G.deck.splice(i,1)[0];p.hand.push(c);UI.renderPiles();
      log(`${nameHTML(p)} 发动【公演·Vocal】：弃 1 麦克风，从牌堆获得一张【桃】（本轮回合内首次成为基本牌目标时摸牌）`,true);
    }else log(`${nameHTML(p)} 发动【公演·Vocal】：弃 1 麦克风，但牌堆中已无【桃】`);
    floatWord('Vocal','info');
  }else if(k==='rap'){
    p.mic-=2;p.rapDmg=true;SFX.skill('gy_rap');
    log(`${nameHTML(p)} 发动【公演·Rap】：弃 2 麦克风，本轮造成的伤害+1！`,true);
    floatWord('Rap','hit');
  }else if(k==='dance'){
    p.hp=Math.min(p.maxHp,p.hp+1);p.dance=true;SFX.skill('gy_dance');
    /* 随机从牌堆使用一张防具牌和一张防御马牌 */
    const ai=G.deck.findIndex(c=>c.slot==='armor');
    if(ai>=0){const c=G.deck.splice(ai,1)[0];equipCard(p,c);}
    const hi=G.deck.findIndex(c=>c.slot==='horse+');
    if(hi>=0){const c=G.deck.splice(hi,1)[0];equipCard(p,c);}
    UI.renderPiles();
    log(`${nameHTML(p)} 发动【公演·Dance】：回复 1 点体力并随机换装，本轮结束后获得随机 0~2 个麦克风`,true);
    floatWord('Dance','heal');
  }
}
/* 杨浩展·公演·Dance：出牌阶段结束后立即获得随机 0~2 个「麦克风」（0/1/2 各 1/3 概率） */
function settleDanceMic(p){
  if(!p.dance)return 0;
  p.dance=false;
  const n=Math.floor(Math.random()*3);   /* → 0 / 1 / 2 */
  p.mic=(p.mic||0)+n;
  log(`${nameHTML(p)}【Dance】演出落幕，获得 <b>${n}</b> 个「麦克风」🎤（现有 ${p.mic} 个）`,true);
  floatWord(`🎤+${n}`,'heal');
  return n;
}

function nextSeat(s){const n=G.players.length;for(let i=1;i<=n;i++){const q=P((s+i)%n);if(q.alive)return q.seat;}return s;}
function seatOrderFrom(s){const n=G.players.length,arr=[];for(let i=0;i<n;i++){const q=P((s+i)%n);if(q.alive)arr.push(q);}return arr;}

async function runTurn(p){
  p.usedSha=0;p.drank=false;p.skipDraw=false;p.skipPlay=false;p.skillUsed={};p.skillCount={};
  if(p.cdDyzt>0)p.cdDyzt--; /* 定燕子朝天：每2回合限一次 */
  /* 二次元形态（张峥）：持续到自己的下个回合开始时结束 */
  if(p.nijigen){
    p.nijigen=false;
    log(`${nameHTML(p)} 的「二次元形态」结束，形象与语音恢复常态`,true);
    UI.render();await sleep(350);
  }
  UI.render();
  log(`—— ${nameHTML(p)} 的回合 ——`,true);
  floatWord(generalOf(p).name+' 的回合','info');
  SFX.turn(p.gid);   /* 播报：到XX出牌了 */
  await sleep(500);
  /* 回合开始：观星 */
  if(hasSkill(p,'guanxing'))await Skills.guanxing(p);
  if(G.over)return;
  /* 判定阶段 */
  await judgePhase(p);
  if(!p.alive||G.over)return;
  /* 摸牌阶段 */
  if(p.skipDraw){log(`${nameHTML(p)} 受兵粮寸断影响，跳过摸牌阶段`);floatWord('兵粮寸断','hit');}
  else{let n=2;await drawCards(p,n);}
  UI.render();await sleep(450);
  /* 出牌阶段 */
  if(p.skipPlay){log(`${nameHTML(p)} 受乐不思蜀影响，跳过出牌阶段`);floatWord('乐不思蜀','hit');}
  else if(p.isAI){await AI.playPhase(p);}
  else if(p.remote){await NET.remotePlayPhase(p);}
  else{await humanPlayPhase(p);}
  if(G.over)return;
  /* 出牌阶段刚结束：杨浩展·公演 Dance 的「随机 0~2 个麦克风」在此刻立即结算到账 */
  if(p.alive&&hasSkill(p,'gy'))settleDanceMic(p);
  /* 弃牌阶段 */
  await discardPhase(p);
  /* 回合结束 */
  if(p.alive)log(`${nameHTML(p)} 回合结束`);
  UI.render();
}

/* ---------- 判定阶段（延时锦囊） ---------- */
async function judgePhase(p){
  const cards=[...p.judges];
  for(const jc of cards){
    if(!p.alive)return;
    // 无懈询问（判定前）
    log(`${nameHTML(p)} 判定区的 ${cardHTML(jc)} 开始判定`);
    const countered=await resolveWuxie(p,p,jc,true);
    if(countered){toDiscard(jc);UI.render();continue;}
    const r=await doJudge(p,jc.name==='乐不思蜀'?'le':'bing',jc);
    toDiscard(jc);
    if(jc.name==='乐不思蜀'){
      if(r.suit==='♥'){log('判定为红桃，乐不思蜀失效');}
      else{p.skipPlay=true;log('判定非红桃，<b>跳过出牌阶段</b>',true);}
    }else{
      if(r.suit==='♣'){log('判定为梅花，兵粮寸断失效');}
      else{p.skipDraw=true;log('判定非梅花，<b>跳过摸牌阶段</b>',true);}
    }
    UI.render();await sleep(400);
  }
}
/* 通用判定：翻判定牌 → 鬼才改判 → 天妒 */
async function doJudge(p,reason,srcCard){
  let card=takeDeck(1)[0];
  log(`${nameHTML(p)} 判定翻牌：${card.suit}${rankText(card.rank)} ${card.name==='杀'||card.name==='闪'||card.name==='桃'||card.name==='酒'?'':''}`);
  UI.showJudge(card);await sleep(650);
  // 鬼才
  const sima=aliveList().find(x=>hasSkill(x,'guicai'));
  if(sima){
    const rep=await askGuicai(sima,card,p,reason);
    if(rep){
      const ix=sima.hand.findIndex(c=>c.uid===rep.uid);if(ix>=0)sima.hand.splice(ix,1);
      SFX.skill('guicai');FX.respondCard(sima,rep);
      log(`${nameHTML(sima)} 发动【鬼才】，以 ${rep.suit}${rankText(rep.rank)} 替换判定牌`,true);
      G.discardPile.push(card);card=rep; // 打出的手牌成为判定牌
      UI.showJudge(card);await sleep(650);
    }
  }
  // 天妒
  if(hasSkill(p,'tiandu')){
    log(`${nameHTML(p)} 发动【天妒】，获得判定牌 ${cardHTML(card)}`);
    p.hand.push(card);
  }else{
    G.discardPile.push(card);
  }
  UI.hideJudge();UI.render();
  return card;
}

/* ---------- 弃牌阶段 ---------- */
/* 弃牌阶段超时兜底：从他手牌里随机弃够数量，保证节奏不被一个人拖住 */
function randomDiscard(p,need){
  const pool=[...p.hand],drop=[];
  for(let i=0;i<need&&pool.length;i++){
    drop.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  }
  return drop;
}
async function discardPhase(p){
  /* 社恐（张峥）：手牌上限 +2 */
  const limit=Math.max(0,p.hp+(hasSkill(p,'shekong')?2:0));
  if(p.hand.length<=limit){return;}
  const need=p.hand.length-limit;
  if(p.isAI){
    const drop=AI.chooseDiscard(p,need);
    for(let i=0;i<drop.length;i++){toDiscard(drop[i]);UI.render();await sleep(280);}
    log(`${nameHTML(p)} 弃置 ${drop.length} 张牌`);
  }else{
    /* 弃牌阶段也读秒：15 秒内没完成弃牌就替他随机弃，别让人挂着不动卡住全桌 */
    armTimer('discard',p.seat,()=>{
      const rd=randomDiscard(p,need);
      for(const c of rd)toDiscard(c);
      log(`${nameHTML(p)} 超时未弃牌，随机弃置 ${rd.length} 张`,true);
      UI.render();
      modalTimeout();                 /* 放掉本机等待中的弃牌弹窗 */
      if(p.remote)NET.abortAsk(p.seat); /* 远程玩家：撤掉这次询问 */
    });
    runTimer();
    let drop=null;
    if(p.remote){
      drop=await NET.askRemote(p,'pickCards',['弃牌阶段：需弃置 '+need+' 张牌',p.hand,{min:need,max:need,confirmText:'弃置',force:true}]);
      if(drop&&drop.length)log(`${nameHTML(p)} 弃置了 ${drop.length} 张牌`);
    }else{
      drop=await UI.pickCards('弃牌阶段：需弃置 '+need+' 张牌',p.hand,{min:need,max:need,confirmText:'弃置',force:true});
      if(drop&&drop.length)log(`你弃置了 ${drop.length} 张牌`);
    }
    stopTimer();
    /* 走超时分支时 drop 为 null（上面已经随机弃过），这里只处理正常手动弃牌 */
    if(drop&&drop.length)for(const c of drop)toDiscard(c);
  }
  UI.render();
}

/* ---------- 玩家出牌阶段 ---------- */
async function humanPlayPhase(p){
  G.selecting=null;
  if(!G.helpShown){G.helpShown=true;await UI.showHelp(true);if(G.over)return;}
  return new Promise(res=>{
    G.playResolve=res;
    UI.setTip(playTip(p));
    armTimer('play',p.seat,()=>{
      toast('超时未操作，自动结束出牌');
      log(`${nameHTML(p)} 超时未操作，自动跳过出牌阶段`,true);
      finishPlayPhase();
    });
    UI.render();       /* 先建档再渲染，席位上的进度条才能在第一时间出现 */
    runTimer();
  });
}
/* ==================== 统一读秒系统 ====================
   凡是「在某处等某个玩家做决定」的场景都挂一个倒计时，超时自动推进，免得有人挂机卡死全桌：
     kind='play'    出牌阶段 → 超时视为过牌，结束出牌阶段
     kind='respond' 需要响应 → 超时视为放弃（闪 / 杀 / 桃 / 无懈可击都走这里）
     kind='discard' 弃牌阶段 → 超时随机弃置应弃数量的牌
   进度条画在「正在被等的那个人的席位」上（注意不是回合玩家：响应时被等的是被打的人），
   并且：
     · 本机 / 房主：真计时，到点执行 onTimeout
     · 客机：只把进度条画出来，不自己推进流程（谁出牌谁负责收尾，避免两端抢着结算）
   刷新一律走 paintTimerBars()：只改 class 与 style.width，绝不重建 DOM —— 否则每 100ms
   重建整棵牌桌，联机端会被直接拖垮。                                                  */
const TURN_SEC=15;
function timerAuthority(){return (typeof NET==='undefined')||!NET.clientMode||NET.hostActive;}
function armTimer(kind,seat,onTimeout,sec){
  stopTimerTick();
  /* 【关键】计时器必须能嵌套：出牌阶段里会临时插入「响应读秒」（别人出闪/出杀/求桃），
     旧实现是 armTimer 直接覆盖、stopTimer 直接清空 —— 内层一结束，外层的出牌倒计时
     就没了，而 playResolve 还挂着，于是「谁也不动就永久卡死」（用户反馈的卡顿元凶）。
     改成栈式：压栈保存外层已跑秒数，内层结束后原样恢复继续跑。 */
  if(G.timer){
    G.timer.savedElapsed=Date.now()-G.timer.t0;
    (G.timerStack||(G.timerStack=[])).push(G.timer);
  }
  G.timer={kind:kind,seat:(seat==null?null:seat),total:sec||TURN_SEC,
           left:sec||TURN_SEC,t0:Date.now(),onTimeout:onTimeout||null};
  paintTimerBars();
}
function runTimer(){
  if(!G.timer)return;
  stopTimerTick();
  const auth=timerAuthority();
  let lastSync=0;
  G.timerId=setInterval(()=>{
    const t=G.timer;if(!t){stopTimerTick();return;}
    t.left=Math.max(0,t.total-(Date.now()-t.t0)/1000);
    paintTimerBars();
    /* 让客机也看得见读秒：房主每 0.5 秒把剩余秒数捎进状态快照发一次 */
    /* 【带宽优化】读秒不能搭全量状态快照的车：快照 4~6KB，每 0.5 秒发一次就是
       约 10KB/s/人，4 个人 40KB/s 上行，cpolar 免费隧道直接被自己打满 —— 这就是联机卡顿。
       改成走一条几十字节的专用轻量消息。 */
    if(auth&&typeof NET!=='undefined'&&NET.hostActive&&Date.now()-lastSync>400){
      lastSync=Date.now();
      NET.broadcast({k:'timer',s:t.seat,l:Math.round(t.left*10)/10,tot:t.total});
    }
    if(t.left<=0){
      if(auth){const cb=t.onTimeout;stopTimer();if(cb)cb();}
      else stopTimerTick();          /* 客机：停在 0，等房主裁决 */
    }
  },100);
}
function resetTimer(sec){const t=G.timer;if(!t)return;t.t0=Date.now();t.left=sec||t.total;paintTimerBars();}
function stopTimerTick(){if(G.timerId){clearInterval(G.timerId);G.timerId=null;}}
/* 结束「当前这一层」计时：弹回上一层（如果有）并接着跑 */
function stopTimer(){
  stopTimerTick();
  const prev=(G.timerStack&&G.timerStack.length)?G.timerStack.pop():null;
  if(prev){
    const el=(prev.savedElapsed||0);
    prev.t0=Date.now()-el;
    prev.left=Math.max(0,prev.total-el/1000);
    G.timer=prev;paintTimerBars();runTimer();
    return;
  }
  G.timer=null;paintTimerBars();
}
/* 彻底清空所有层（回合结束等） */
function stopAllTimers(){stopTimerTick();G.timerStack=[];G.timer=null;paintTimerBars();}
function paintTimerBars(){
  const t=G.timer;
  document.querySelectorAll('[data-timerbar]').forEach(el=>{
    const seat=Number(el.getAttribute('data-timerbar'));
    if(!t||seat!==t.seat){el.classList.remove('on');return;}
    el.classList.add('on');
    const pct=Math.max(0,Math.min(100,t.left/t.total*100));
    const bar=el.querySelector('.turn-bar'),secEl=el.querySelector('.turn-sec');
    if(bar){bar.style.width=pct+'%';bar.classList.toggle('urgent',t.left<=5);}
    if(secEl)secEl.textContent=Math.ceil(t.left)+'s';
  });
}
/* 只停「弹窗类」计时，别误杀出牌阶段的计时
   （出牌时点开武将详情再关掉，不该把回合倒计时清掉） */
function stopModalTimer(){
  if(G.timer&&(G.timer.kind==='respond'||G.timer.kind==='discard'))stopTimer();
}
/* 弹窗超时：关掉弹窗并把等待方唤醒成 null。
   不能直接用 closeModal() —— 它把 G.mres 清成 null 却不 resolve，等待的 Promise 会永远挂着。
   客机还要把「放弃」回传给房主，否则房主端会一直等下去。 */
function modalTimeout(){
  const ask=(typeof NET!=='undefined'&&NET.clientMode&&NET.currentAsk)?NET.currentAsk:null;
  if(ask)NET.currentAsk=null;
  const r=G.mres;G.mres=null;
  const ml=$('#modal-layer');if(ml)ml.classList.add('hidden');
  const mb=$('#modal-box');if(mb)mb.innerHTML='';
  stopModalTimer();
  if(r)r(null);
  if(ask){try{NET.sendAnswer(ask,null);}catch(e){}}
}
function finishPlayPhase(){
  stopAllTimers();
  if(G.playResolve){G.selecting=null;const r=G.playResolve;G.playResolve=null;r();}
}

/* ==================== 响应询问系统 ==================== */
/* 统一入口：need=杀/闪/桃/无懈；返回 {card, virtualName?, via?} 或 null */
async function askResponse(p,ctx){
  if(p.isAI)return await AI.respond(p,ctx);
  if(p.remote){
    /* 房主端等待远程玩家响应：一样读秒。
       超时直接撤掉这次询问并按「放弃」结算，否则某个人挂着不动会把全桌卡死在 await 上。 */
    let settled=false;
    armTimer('respond',p.seat,()=>{
      settled=true;
      toast('对方响应超时，视为放弃');
      log(`${nameHTML(p)} 响应超时，视为放弃`,true);
      NET.abortAsk(p.seat);
    });
    runTimer();
    const ans=await NET.askRemote(p,'askHuman',[ctx]);
    if(!settled)stopTimer();
    return ans;
  }
  return await UI.askHuman(p,ctx);
}
/* 计算某角色可打出的响应牌（含武圣/龙胆转化，去重） */
function responseOptions(p,need){
  const map=new Map();
  /* 禁桃：桃在杨浩展手里恒为【杀】，任何"需要桃"的场合都不能用（含救自己/救别人） */
  const jt=(need==='桃')&&hasSkill(p,'jt');
  for(const c of p.hand){
    if(jt&&c.name==='桃')continue;
    if(c.name===need){map.set(c.uid,{card:c});continue;}
    if(need==='杀'){
      if(hasSkill(p,'jt')&&c.name==='桃'&&!map.has(c.uid))
        map.set(c.uid,{card:c,virtualName:'杀',via:'禁桃'});
      if(hasSkill(p,'wusheng')&&(c.suit==='♥'||c.suit==='♦')&&!map.has(c.uid))
        map.set(c.uid,{card:c,virtualName:'杀',via:'武圣'});
      if(hasSkill(p,'longdan')&&c.name==='闪'&&!map.has(c.uid))
        map.set(c.uid,{card:c,virtualName:'杀',via:'龙胆'});
    }
    if(need==='闪'&&hasSkill(p,'longdan')&&c.name==='杀'&&!map.has(c.uid))
      map.set(c.uid,{card:c,virtualName:'闪',via:'龙胆'});
  }
  return [...map.values()];
}
function playResponse(p,ans){
  if(!ans)return;
  if(ans.card){
    const vname=ans.virtualName||ans.card.name;
    FX.respondCard(p,ans.card,vname,ans.via);
    if(ans.via==='龙胆')SFX.skill('longdan');
    else if(ans.via==='武圣')SFX.skill('wusheng');
    else if(ans.via==='禁桃')SFX.skill('jt');
    else if(vname==='杀'&&hasSkill(p,'paoxiao'))SFX.skill('paoxiao');
    else SFX.card(vname,ans.card,p);
    toDiscard(ans.card);
    /* 打出响应牌后立刻广播最新手牌 —— 否则远程玩家下一次被询问时
       看到的还是旧手牌（决斗中「打出一张杀后仍显示两张，选了已打出的那张就掉血」） */
    UI.render();
  }
}
/* 求闪（先结算八卦阵） */
async function askShan(p,src,ignoreArmor){
  if(p.equips.armor&&p.equips.armor.name==='八卦阵'&&!ignoreArmor){
    let use=true;
    if(p.remote)use=await NET.askRemote(p,'yesNo',['发动八卦阵？','你需要打出一张【闪】，是否先判定八卦阵？']);
    else if(!p.isAI)use=await UI.yesNo('发动八卦阵？','你需要打出一张【闪】，是否先判定八卦阵？');
    if(use){
      log(`${nameHTML(p)} 发动【八卦阵】判定`);
      SFX.play('bagua');
      const r=await doJudge(p,'bagua');
      if(r.suit==='♥'||r.suit==='♦'){log('八卦阵判定为红色，<b>视为打出闪</b>',true);floatWord('八卦·闪','heal');return{via:'八卦阵'};}
      log('八卦阵判定为黑色，仍需出闪');
    }
  }
  return await askResponse(p,{need:'闪',reason:'sha',source:src});
}
/* 鬼才改判询问 */
async function askGuicai(sima,card,p,reason){
  if(sima.isAI)return AI.guicai(sima,card,p,reason);

/* ==================== 主动出牌合法性 ==================== */
function canPlay(p,card,virtualName){
  const name=virtualName||card.name;
  if(name==='杀'){
    /* 禁桃：桃视为杀，且不计入使用次数 —— 不受 usedSha 限制，打出后也不累加 usedSha */
    const jtTao=card.name==='桃'&&hasSkill(p,'jt');
    if(!jtTao&&p.usedSha>=1&&!(hasSkill(p,'paoxiao')||(p.equips.weapon&&p.equips.weapon.name==='诸葛连弩')||(hasSkill(p,'jdqs')&&(p.skillCount.jdqs||0)>0)||p.nijigen))
      return{ok:false,reason:'本回合已出过杀（装备诸葛连弩或张飞咆哮可不限次数）'};
    if(validShaTargets(p).length===0)return{ok:false,reason:'攻击范围内没有可使用杀的目标'};
    return{ok:true,needTarget:true,targets:validShaTargets(p)};
  }
  if(name==='桃'){
    if(hasSkill(p,'jt'))return{ok:false,reason:'禁桃：你的【桃】均视为【杀】，点击将作为杀使用'};
    if(p.hp>=p.maxHp)return{ok:false,reason:'体力已满，无需使用桃'};
    return{ok:true};
  }
  if(name==='酒'){
    if(p.drank)return{ok:false,reason:'本回合已使用过酒'};
    return{ok:true};
  }
  if(card.type==='equip'){
    if(p.equips[card.slot]&&p.equips[card.slot].name===card.name)return{ok:false,reason:'已装备同名装备'};
    return{ok:true};
  }
  if(name==='无中生有')return{ok:true};
  if(name==='南蛮入侵'||name==='万箭齐发')return{ok:true};
  if(name==='过河拆桥'){
    const t=othersAlive(p).filter(q=>regionCards(q).length>0);
    if(!t.length)return{ok:false,reason:'没有可拆牌的目标'};
    return{ok:true,needTarget:true,targets:t};
  }
  if(name==='顺手牵羊'){
    const t=othersAlive(p).filter(q=>distance(p,q)===1&&regionCards(q).length>0);
    if(!t.length)return{ok:false,reason:'距离1以内没有可牵牌的目标'};
    return{ok:true,needTarget:true,targets:t};
  }
  if(name==='决斗'){
    const t=othersAlive(p).filter(q=>!(hasSkill(q,'kongcheng')&&q.hand.length===0)&&!hasSkill(q,'shekong'));
    if(!t.length)return{ok:false,reason:'没有可决斗的目标（社恐不能成为决斗目标）'};
    return{ok:true,needTarget:true,targets:t};
  }
  if(name==='乐不思蜀'){
    const t=othersAlive(p).filter(q=>!q.judges.some(j=>j.name==='乐不思蜀'));
    if(!t.length)return{ok:false,reason:'没有可贴乐不思蜀的目标'};
    return{ok:true,needTarget:true,targets:t};
  }
  if(name==='兵粮寸断'){
    const t=othersAlive(p).filter(q=>distance(p,q)===1&&!q.judges.some(j=>j.name==='兵粮寸断'));
    if(!t.length)return{ok:false,reason:'距离1以内没有可贴兵粮寸断的目标'};
    return{ok:true,needTarget:true,targets:t};
  }
  if(name==='无懈可击')return{ok:false,reason:'无懈可击需在锦囊结算时打出'};
  if(name==='闪')return{ok:false,reason:'闪仅在被要求时打出'};
  return{ok:false,reason:'此牌当前无法主动使用'};
}
function regionCards(p){ // 可被拆/牵的区域牌（装备+判定+手牌数）
  const arr=[];
  for(const slot in p.equips)if(p.equips[slot])arr.push({card:p.equips[slot],place:'equip',slot});
  for(const j of p.judges)arr.push({card:j,place:'judges'});
  for(const h of p.hand)arr.push({card:h,place:'hand'});
  return arr;
}

/* ==================== 主动出牌主入口 ==================== */
async function playFromHand(p,card,virtualName,target){
  resetTimer();   /* 打出一张牌＝有动作，回合计时重置为 15 秒（玩家/AI 都走这个统一入口） */
  const name=virtualName||card.name;
  G.busy=true;UI.render();
  /* 实体卡飞出 + 指向箭头 + 卡牌音效（统一入口，玩家与AI均经过此处） */
  const TGT_CARDS=['杀','过河拆桥','顺手牵羊','决斗','乐不思蜀','兵粮寸断'];
  const needTgt=TGT_CARDS.includes(name)&&!!target;
  const fxCard=FX.playCard(p,card,needTgt?target:null);
  const fxArrow=needTgt?FX.arrow(p,target):null;
  const convSkill=virtualName&&card.name!==name&&name==='杀'
    ?(card.name==='闪'&&hasSkill(p,'longdan')?'longdan':(card.name==='桃'&&hasSkill(p,'jt')?'jt':(hasSkill(p,'wusheng')?'wusheng':null))):null;
  if(convSkill)SFX.skill(convSkill);
  else if(name==='杀'&&hasSkill(p,'paoxiao'))SFX.skill('paoxiao');
  else SFX.card(name,card,p);
  try{
    if(name==='杀'){
      const real=virtualName?makeVirtual(card,virtualName):card;
      await shaFlow(p,target,real);
    }
    else if(name==='桃'){toDiscard(card);p.hp=Math.min(p.maxHp,p.hp+1);log(`${nameHTML(p)} 使用桃，回复1点体力`);floatWord('+1','heal');}
    else if(name==='酒'){toDiscard(card);p.drank=true;log(`${nameHTML(p)} 使用酒，下一张杀伤害+1`);floatWord('酒','info');}
    else if(card.type==='equip'){
      const i=p.hand.findIndex(c=>c.uid===card.uid);if(i>=0)p.hand.splice(i,1);
      equipCard(p,card);floatWord(card.name,'info');
    }
    else if(name==='无中生有'){
      toDiscard(card);
      if(await resolveWuxie(p,p,card)){UI.render();G.busy=false;return;}
      log(`${nameHTML(p)} 使用无中生有，摸两张牌`);floatWord('无中生有','info');
      await drawCards(p,2);
    }
    else if(name==='南蛮入侵'||name==='万箭齐发'){
      await aoeFlow(p,card);
    }
    else if(name==='过河拆桥'||name==='顺手牵羊'){
      toDiscard(card);
      if(await resolveWuxie(p,target,card)){UI.render();G.busy=false;return;}
      const pick=await chooseRegionCard(p,target);
      if(!pick){log('目标区域已无牌');UI.render();G.busy=false;return;}
      if(name==='过河拆桥'){log(`${nameHTML(p)} 对 ${nameHTML(target)} 使用过河拆桥，弃置${pick.card.name}`);toDiscard(pick.card);floatWord('过河拆桥','info');}
      else{log(`${nameHTML(p)} 对 ${nameHTML(target)} 使用顺手牵羊，获得${pick.card.name}`);handCard(p,pick.card);floatWord('顺手牵羊','info');}
    }
    else if(name==='决斗'){
      if(await resolveWuxie(p,target,card)){toDiscard(card);UI.render();G.busy=false;return;}
      await duelFlow(p,target,card);
    }
    else if(name==='乐不思蜀'||name==='兵粮寸断'){
      const i=p.hand.findIndex(c=>c.uid===card.uid);if(i>=0)p.hand.splice(i,1);
      target.judges.push(card);
      if(await resolveWuxie(p,target,card,true)){/* 延时锦囊被无懈 */toDiscard(card);}
      else{log(`${nameHTML(p)} 将${cardHTML(card)}置于 ${nameHTML(target)} 判定区`);floatWord(card.name,'info');}
    }
  }finally{
    if(fxArrow)FX.fadeArrow(fxArrow);
    G.busy=false;UI.render();
    if(!p.isAI&&G.playResolve)UI.setTip(playTip(p));
  }
}
function makeVirtual(card,vname){return{...card,uid:card.uid,virtual:true,virtualName:vname};}
function playTip(p){
  if(p.hand.length>p.hp)return '出牌阶段：出牌结束后需弃置多余手牌';
  return '出牌阶段：点击手牌使用；可发动技能或结束回合';
}

/* ---------- 杀 ---------- */
async function shaFlow(user,target,card){
  const entity=card.virtual?card:card;
  // 实体牌入弃牌堆（转化技弃原牌）
  if(!card.virtual)toDiscard(card);
  else{const orig=user.hand.find(c=>c.uid===card.uid);if(orig)toDiscard(orig);}
  /* 禁桃：桃视为杀且不计入使用次数 */
  if(card.virtual&&card.name==='桃'&&hasSkill(user,'jt'))log('【禁桃】此【桃】视为【杀】，不计入使用次数');
  else user.usedSha++;
  const via=card.virtual?`（${card.via}）`:'';
  log(`${nameHTML(user)} 对 ${nameHTML(target)} 使用【杀】${via}`);
  floatWord('殺','hit');UI.render();await sleep(480);
  /* 公演·Vocal：本轮回合内首次成为基本牌的目标时，摸一张牌 */
  if(target.vocal&&!target.vocalUsed&&hasSkill(target,'gy')){
    target.vocalUsed=true;
    log(`${nameHTML(target)} 触发【公演·Vocal】效果，摸一张牌`,true);
    await drawCards(target,1);
  }
  const ignoreArmor=user.equips.weapon&&user.equips.weapon.name==='青釭剑';
  const ans=await askShan(target,user,ignoreArmor);
  if(ans){playResponse(target,ans);log(`${nameHTML(target)} 打出【闪】，闪避成功`);floatWord('閃','heal');UI.render();return;}
  if(user.equips.weapon&&user.equips.weapon.name==='寒冰剑'){
    const useIce=user.isAI?regionCards(target).length>=2:(user.remote?await NET.askRemote(user,'yesNo',['发动寒冰剑？','【杀】命中！可防止伤害，改为弃置目标两张牌。']):await UI.yesNo('发动寒冰剑？','【杀】命中！可防止伤害，改为弃置目标两张牌。'));
    if(useIce){
      log(`${nameHTML(user)} 发动【寒冰剑】，弃置 ${nameHTML(target)} 两张牌`);
      for(let i=0;i<2;i++){const pk=await chooseRegionCard(user,target,true);if(pk)toDiscard(pk.card);else break;await sleep(300);}
      floatWord('寒冰剑','info');UI.render();return;
    }
  }
  let dmg=1;
  if(user.drank){dmg=2;user.drank=false;log('酒劲发作，此杀伤害+1',true);floatWord('酒杀','hit');}
  await dealDamage(user,target,dmg,entity,'杀');
}

/* ---------- 决斗 ---------- */
async function duelFlow(caster,target,card){
  const entity=card;
  toDiscard(card);

async function firstWuxie(list,caster,target,card){

async function resolveWuxie(caster,target,card,delay){

/* ==================== 伤害结算 ==================== */
const REASON_TEXT={'杀':'杀','决斗':'决斗','南蛮入侵':'南蛮入侵','万箭齐发':'万箭齐发','刚烈':'刚烈',
  'wqdd':'无情大吊','jbrm':'揪别人毛','pycg':'屁眼唇膏','低气压':'低气压','十连':'十连','梭哈':'梭哈','还款':'还款'};
async function dealDamage(src,target,amount,card,reason){
  if(!target.alive)return;
  /* 公演·Rap：本轮你造成的伤害+1 */
  if(src&&src!==target&&src.alive&&src.rapDmg){
    amount++;log(`【公演·Rap】炸场加成，本次伤害+1！`,true);floatWord('Rap+1','hit');
  }
  /* 觉醒（张嵘）：觉醒后本局【杀】伤害+1 */
  if(src&&src!==target&&src.alive&&src.awakened&&reason==='杀'){
    amount++;log(`【觉醒】${nameHTML(src)} 的【杀】威力提升，本次伤害+1！`,true);floatWord('觉醒+1','hit');
  }
  /* 封心（张嵘·未觉醒）：受到的伤害-1（至少保留 1 点）；觉醒后此技失效 */
  if(src&&src!==target&&hasSkill(target,'fengxin')&&amount>1){
    amount--;log(`【封心】${nameHTML(target)} 封闭内心，本次受到的伤害-1`,true);floatWord('封心-1','heal');
  }
  target.hp-=amount;
  SFX.hurt(target);
  log(`${nameHTML(target)} 受到 ${amount} 点伤害【${REASON_TEXT[reason]||reason}】，剩余体力 ${Math.max(0,target.hp)}`,true);
  floatWord('-'+amount,'hit');UI.render();await sleep(520);
  /* 奸雄：获得伤害牌 */
  if(card&&card.uid&&hasSkill(target,'jianxiong')){
    const loc=findCardAnywhere(card.uid);
    if(loc&&loc.place==='discard'){
      handCard(target,card);
      SFX.skill('jianxiong');
      log(`${nameHTML(target)} 发动【奸雄】，获得伤害牌 ${cardHTML(card)}`,true);
    }
  }
  /* 反馈 */
  if(src&&src!==target&&src.alive&&hasSkill(target,'fankui'))await Skills.fankui(target,src);
  /* 遗计 */
  if(hasSkill(target,'yiji'))await Skills.yiji(target,amount,src);
  /* 刚烈 */
  if(src&&src!==target&&src.alive&&hasSkill(target,'ganglie')&&reason!=='刚烈')await Skills.ganglie(target,src);
  /* 定燕子朝天：翻面者受到任意伤害后翻回，技能恢复 */
  if(target.flipped){
    target.flipped=false;
    log(`${nameHTML(target)} 受到伤害，武将牌翻回正面，技能恢复！`,true);
    floatWord('翻回','heal');
  }
  /* 濒死 */
  if(target.hp<=0)await dyingFlow(target,src);
  /* 死而复生：剩1血时自动补满（每局限一次） */
  if(target.alive&&target.hp===1&&hasSkill(target,'sefs')&&!target.sefsGameUsed){
    target.sefsGameUsed=true;
    target.hp=target.maxHp;
    SFX.skill('sefs');
    log(`${nameHTML(target)} 发动【死而复生】，体力自动补满至 ${target.maxHp} 点！`,true);
    floatWord('死而复生','heal');UI.render();await sleep(500);
  }
  UI.render();
  if(!G.over)checkWin();
}

/* ==================== 濒死求桃 ==================== */
async function askTaoren(p,target){
  return askResponse(p,{need:'桃',reason:'dying',dyingTarget:target});
}
async function dyingFlow(target,src){
  log(`${nameHTML(target)} 进入<span style="color:#ff8a7a">濒死</span>状态，求桃！`,true);
  floatWord('求 桃','hit');UI.render();
  let guard=0;
  while(target.hp<=0&&target.alive&&guard++<30){
    let any=false;
    for(const p of seatOrderFrom(G.turnSeat)){
      if(target.hp>0||!target.alive)break;
      /* 禁桃（杨浩展）：其【桃】均视为【杀】，无法用来救别人；但他本人可以被别人救。
         酒不受禁桃影响，所以他自己濒死时仍可用【酒】自救。 */
      if(p!==target&&hasSkill(p,'jt'))continue;
      const ans=await askTaoren(p,target);
      if(ans){
        any=true;
        const isJiu=ans.card&&ans.card.name==='酒';
        playResponse(p,ans);
        let heal=1;
        if(!isJiu&&G.mode==='identity'&&target.identity==='lord'&&hasSkill(target,'jiuyuan')
           &&generalOf(p).kingdom==='wu'&&p!==target)heal=2;
        target.hp+=heal;
        log(`${nameHTML(p)} 使用【${isJiu?'酒':'桃'}】救回 ${nameHTML(target)}，回复 ${heal} 点体力`,true);
        floatWord('+'+heal,'heal');UI.render();await sleep(400);
      }
    }
    if(!any)break;
  }
  if(target.hp<=0&&target.alive)await die(target,src);
}

/* ==================== 阵亡 ==================== */
async function die(p,killer){
  p.alive=false;p.hp=0;
  for(const c of[...p.hand])toDiscard(c);
  for(const slot in p.equips)if(p.equips[slot])toDiscard(p.equips[slot]);
  for(const j of[...p.judges])toDiscard(j);
  log(`<b>${generalOf(p).name} 阵亡！</b>${G.mode==='identity'?'身份为【'+ID_TEXT[p.identity]+'】':''}`,true);
  floatWord(generalOf(p).name+'阵亡','hit');
  p.revealed=true;UI.render();await sleep(700);
  if(G.mode==='identity'&&killer&&killer.alive){
    if(p.identity==='rebel'){
      log(`${nameHTML(killer)} 击杀反贼，摸三张牌`,true);
      await drawCards(killer,3,'击杀反贼');
    }
    if(p.identity==='loyal'&&killer.identity==='lord'){
      for(const c of[...killer.hand])toDiscard(c);
      for(const slot in killer.equips)if(killer.equips[slot])toDiscard(killer.equips[slot]);
      log('主公误杀忠臣，弃置所有牌！',true);floatWord('众叛亲离','hit');
    }
  }
  UI.render();
}

/* ==================== 胜负判定 ==================== */
const ID_TEXT={lord:'主公',loyal:'忠臣',rebel:'反贼',renegade:'内奸'};
function checkWin(){
  if(G.over)return;
  const al=aliveList();
  const h=human();
  if(G.mode==='duel'){
    if(!h.alive)return endGame(false,'败 北','你在单挑中被击败');
    if(al.length===1&&h.alive)return endGame(true,'胜 利','你击败了对手，单挑获胜！');
    return;
  }
  const lord=G.players.find(p=>p.identity==='lord');
  const rebelAlive=G.players.some(p=>p.identity==='rebel'&&p.alive);
  const ren=G.players.find(p=>p.identity==='renegade');
  const loyalAlive=G.players.some(p=>p.identity==='loyal'&&p.alive);
  if(!lord.alive){
    if(ren.alive&&!rebelAlive&&!loyalAlive&&aliveList().length===1)
      return endGame(false,'内奸胜利','主公殂没，内奸 '+generalOf(ren).name+' 独掌乾坤');
    return endGame(false,'反贼胜利','主公阵亡，反贼起事成功');
  }
  if(!rebelAlive&&!ren.alive)return endGame(true,'主忠胜利','反贼与内奸皆已伏诛，汉室中兴！');
}
function endGame(win,title,detail){
  G.over=true;
  finishPlayPhase();
  if(typeof NET!=='undefined'&&NET.hostActive)NET.endNetGame(title,detail);
  setTimeout(()=>UI.showResult(win,title,detail),500);
}
