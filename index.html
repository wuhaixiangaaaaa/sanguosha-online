/* ==================== AI 系统 ==================== */
/* 身份立场下的目标评分 */
function aiTargetScore(p,t){
  if(t===p)return -9999;
  if(G.mode==='duel')return 100-t.hp*9+t.hand.length*1.5;
  if(sameSide(p,t))return -1000;
  const id=p.identity;let s=0;
  const rebelAlive=G.players.some(x=>x.identity==='rebel'&&x.alive);
  if(id==='rebel')s=t.identity==='lord'?100:t.identity==='loyal'?60:t.identity==='renegade'?22:25;
  else if(id==='loyal'||id==='lord')s=t.identity==='rebel'?90:(!rebelAlive&&t.identity==='renegade'?86:10);
  else if(id==='renegade'){
    // 内奸：反贼存活时蛰伏观望，不主动出击；反贼清除后再收割主忠
    if(rebelAlive)return -100;
    s=t.identity==='lord'?95:t.identity==='loyal'?74:35;
  }
  s+=(t.maxHp-t.hp)*8+t.hand.length*1.5;
  if(t.hp<=1)s+=30;
  return s;
}
function aiPickTarget(p,filter){
  const c=othersAlive(p).filter(q=>filter(q));
  if(!c.length)return null;
  c.sort((a,b)=>aiTargetScore(p,b)-aiTargetScore(p,a));
  return c[0];
}
/* 主公技：同势力队友代出 */
async function lordProxy(p,need){
  const skill=need==='杀'?'jijiang':'hujia';
  if(!hasSkill(p,skill))return null;
  const ks=need==='杀'?'shu':'wei';
  for(const a of seatOrderFrom(p.seat)){
    if(a===p||!a.alive||generalOf(a).kingdom!==ks)continue;
    let ans=null;
    if(a.isAI)ans=await AI.respond(a,{need,reason:'lord'+need,source:p});
    else if(a.remote)ans=await NET.askRemote(a,'askHuman',[{need,reason:'lord'+need,source:p}]);
    if(ans){ans.proxy=a;ans.via=skill==='jijiang'?'激将':'护驾';
      log(`${nameHTML(a)} 响应【${ans.via}】，替 ${nameHTML(p)} 打出【${need}】`,true);return ans;}
  }
  return null;
}
const CARD_KEEP={桃:10,无懈可击:9,无中生有:9,闪:8,杀:7,乐不思蜀:7,酒:6,决斗:6,兵粮寸断:6,南蛮入侵:5,万箭齐发:5,顺手牵羊:5,过河拆桥:4};
function cardKeepValue(c){
  if(CARD_KEEP[c.name]!==undefined)return CARD_KEEP[c.name];
  if(c.type==='equip')return c.slot==='armor'?7:c.slot==='horse-'?6:5;
  return 3;
}
const AI={
  async sleep(ms){await sleep(ms);},
  /* ---------- 响应询问 ---------- */
  async respond(p,ctx){
    await sleep(380+rnd(280));
    const need=ctx.need;
    /* 濒死求桃 */
    if(need==='桃'){
      const t=ctx.dyingTarget;
      const jt=hasSkill(p,'jt');   /* 禁桃：桃视为杀，不能当桃用 */
      if(t===p){
        if(!jt){const tao=p.hand.find(c=>c.name==='桃');if(tao)return{card:tao};}
        const jiu=p.hand.find(c=>c.name==='酒');if(jiu)return{card:jiu};
        return null;
      }
      if(jt)return null;           /* 禁桃武将救不了别人 */
      if(G.mode!=='identity')return null;
      let will=sameSide(p,t);
      if(!will&&p.identity==='renegade'&&t.identity==='lord'
         &&G.players.some(x=>x.identity==='rebel'&&x.alive))will=true;
      if(!will)return null;
      const tao=p.hand.find(c=>c.name==='桃');
      return tao?{card:tao}:null;
    }
    /* 无懈 */
    if(need==='无懈'){
      const wx=p.hand.find(c=>c.name==='无懈可击');if(!wx)return null;
      const tr=ctx.trick?ctx.trick.name:'';
      let prob=.35;
      if(['乐不思蜀','兵粮寸断','决斗','无中生有'].includes(tr))prob=.95;
      else if(['顺手牵羊','过河拆桥'].includes(tr))prob=.7;
      if(ctx.target===p)prob=.98;
      return Math.random()<prob?{card:wx}:null;
    }
    /* 杀 / 闪 */
    const real=p.hand.find(c=>c.name===need);
    if(real)return{card:real};
    if(need==='杀'){
      if(hasSkill(p,'longdan')){const s=p.hand.find(c=>c.name==='闪');if(s)return{card:s,virtualName:'杀',via:'龙胆'};}
      if(hasSkill(p,'wusheng')){
        const c=p.hand.find(x=>(x.suit==='♥'||x.suit==='♦')&&!['桃','无中生有','无懈可击','酒'].includes(x.name)&&x.type!=='equip');
        if(c)return{card:c,virtualName:'杀',via:'武圣'};
      }
    }
    if(need==='闪'&&hasSkill(p,'longdan')){const s=p.hand.find(c=>c.name==='杀');if(s)return{card:s,virtualName:'闪',via:'龙胆'};}
    /* 主公技代出 */
    if((need==='杀'||need==='闪')&&p.identity==='lord'){
      const px=await lordProxy(p,need);if(px)return px;
    }
    return null;
  },
  /* ---------- 鬼才改判 ---------- */
  guicai(sima,card,p,reason){
    const ally=sima===p||sameSide(sima,p);
    const isRed=c=>c.suit==='♥'||c.suit==='♦';
    const pick=cond=>{
      const pool=sima.hand.filter(c=>c.name!=='无懈可击'&&c.name!=='桃'&&cond(c)).sort((a,b)=>cardKeepValue(a)-cardKeepValue(b));
      return pool[0]||null;
    };
    if(reason==='bagua'){const r=isRed(card);if(ally&&!r)return pick(c=>isRed(c));if(!ally&&r)return pick(c=>!isRed(c));return null;}
    if(reason==='le'){const h=card.suit==='♥';if(ally&&!h)return pick(c=>c.suit==='♥');if(!ally&&h)return pick(c=>c.suit!=='♥');return null;}
    if(reason==='bing'){const c=card.suit==='♣';if(ally&&!c)return pick(x=>x.suit==='♣');if(!ally&&c)return pick(x=>x.suit!=='♣');return null;}
    if(reason==='ganglie'){const h=card.suit==='♥';if(ally&&!h)return pick(c=>c.suit==='♥');if(!ally&&h)return pick(c=>c.suit!=='♥');return null;}
    return null;
  },
  /* ---------- 弃牌 ---------- */
  chooseDiscard(p,n){
    return[...p.hand].sort((a,b)=>cardKeepValue(a)-cardKeepValue(b)).slice(0,n);
  },
  /* ---------- 拆/牵/反馈/寒冰 选目标区域牌 ---------- */
  chooseRegionCard(actor,target){
    const reg=regionCards(target);
    const friend=sameSide(actor,target);
    if(friend){const j=reg.find(r=>r.place==='judges');if(j)return j;}
    else{
      for(const slot of['weapon','horse+','armor','horse-']){
        const r=reg.find(x=>x.place==='equip'&&x.slot===slot);if(r)return r;
      }
    }
    const hands=reg.filter(r=>r.place==='hand');
    if(hands.length)return hands[rnd(hands.length)];
    return reg[rnd(reg.length)];
  },
  /* ---------- 出牌阶段 ---------- */
  async playPhase(p){
    UI.setTip(generalOf(p).name+'（AI）思考中……');
    let guard=0,acted=true;
    while(acted&&!G.over&&p.alive&&guard++<45){
      acted=false;
      const h=p.hand;
      /* 1. 残血吃桃（禁桃武将的桃视为杀，不能吃） */
      const tao=h.find(c=>c.name==='桃');
      if(tao&&!hasSkill(p,'jt')&&p.hp<p.maxHp&&p.hp<=Math.ceil(p.maxHp/2)){await playFromHand(p,tao);acted=true;await sleep(520);continue;}
      /* 2. 制衡 */
      if(hasSkill(p,'zhiheng')&&!p.skillUsed.zhiheng){
        const cs=AI.zhihengCards(p);
        if(cs.length){await doZhiheng(p,cs);acted=true;await sleep(520);continue;}
      }
      /* 3. 仁德 */
      if(hasSkill(p,'rende')&&!p.skillUsed.rende){
        const r=AI.rendePlan(p);
        if(r){await doRende(p,r.cards,r.target);acted=true;await sleep(520);continue;}
      }
      /* 3.5 自创武将技能 */
      const avgHp=a=>a.reduce((s,x)=>s+x.hp,0)/a.length;
      if((hasSkill(p,'pycg')||hasSkill(p,'wqdd'))){
        const key=hasSkill(p,'pycg')?'pycg':'wqdd';
        const foes=enemiesOf(p);
        if(customLeft(p,key)>0&&foes.length){
          const mine=[p,...alliesOf(p)];
          if(G.mode==='duel'||foes.length===1||avgHp(mine)+0.5>=avgHp(foes)){
            if(key==='pycg')await doPycg(p);else await doWqdd(p);
            acted=true;await sleep(700);continue;
          }
        }
      }
      if(hasSkill(p,'jbrm')&&customLeft(p,'jbrm')>0){
        if(G.mode==='duel'||enemiesOf(p).length>=2){await doJbrm(p);acted=true;await sleep(560);continue;}
      }
      if(hasSkill(p,'jjm')&&customLeft(p,'jjm')>0&&h.filter(c=>c.name==='杀').length<2){
        doJjm(p);acted=true;await sleep(480);continue;
      }
      if(hasSkill(p,'jdqs')&&customLeft(p,'jdqs')>0&&p.hp<=1){
        doJdqs(p);acted=true;await sleep(520);continue;
      }
      if(hasSkill(p,'hjlb')&&customLeft(p,'hjlb')>0){
        const oth=othersAlive(p);
        if(oth.length>=2){
          /* 手牌最多者与最少者互换，收益最大 */
          const sorted=[...oth].sort((a,b)=>b.hand.length-a.hand.length);
          const t1=sorted[0],t2=sorted[sorted.length-1];
          if(t1!==t2&&t1.hand.length-t2.hand.length>=2){await doHjlb(p,t1,t2);acted=true;await sleep(620);continue;}
        }
      }
      /* 赵延莲·定燕子朝天：翻面最强的有主动技敌人 */
      if(hasSkill(p,'dyzt')&&(p.cdDyzt||0)<=0){
        const t=enemiesOf(p).filter(q=>!q.flipped&&generalOf(q).skills.some(s=>s.type==='active'))
          .sort((a,b)=>(b.maxHp+b.hand.length)-(a.maxHp+a.hand.length))[0];
        if(t){await doDyzt(p,t);acted=true;await sleep(600);continue;}
      }
      /* 赵延莲·思想长毛：优先凑满 2 根毛触发乐不思蜀 */
      if(hasSkill(p,'sxcm')&&customLeft(p,'sxcm')>0){
        const t=enemiesOf(p).filter(q=>!q.judges.some(j=>j.name==='乐不思蜀'))
          .sort((a,b)=>((b.sxcmMao||0)*10+b.hand.length+b.hp)-((a.sxcmMao||0)*10+a.hand.length+a.hp))[0];
        if(t){
          const need=(t.sxcmMao||0)>=1?1:2;
          const junk=h.filter(c=>!['杀','闪','桃','酒','无中生有'].includes(c.name));
          const dump=junk.length>=need?junk.slice(0,need):(h.length>need?h.slice(0,need):null);
          if(dump&&dump.length){await doSxcm(p,t,dump);acted=true;await sleep(560);continue;}
        }
      }
      /* ---- 张嵘 ---- */
      /* 觉醒：残血时立刻觉醒，换形象并获得强力技能 */
      if(hasSkill(p,'juexing')&&!p.awakened&&p.hp<=2){await doJuexing(p);acted=true;await sleep(700);continue;}
      /* 自爱：掉血就补，先把牌用出去 */
      if(hasSkill(p,'zian')&&customLeft(p,'zian')>0&&p.hp<=p.maxHp-1&&h.length){
        const junk=AI.chooseDiscard(p,1)[0];
        if(junk){await doZian(p,junk);acted=true;await sleep(560);continue;}
      }
      /* 自强（觉醒后）：摸 2 弃 1，手牌少时用 */
      if(hasSkill(p,'ziqiang')&&customLeft(p,'ziqiang')>0&&h.length<=2){
        await doZiqiang(p);acted=true;await sleep(560);continue;
      }
      /* 梭哈（觉醒后）：全场 1 点，只有在没有队友会被误伤时才用 */
      if(hasSkill(p,'suoha')&&customLeft(p,'suoha')>0){
        const foes=enemiesOf(p);
        if((G.mode==='duel'||alliesOf(p).length===0)&&foes.length>=2&&h.length>=3){
          await doSuoha(p);acted=true;await sleep(760);continue;
        }
      }
      /* 还款：向敌人催收手牌 */
      if(hasSkill(p,'huankuan')&&customLeft(p,'huankuan')>0){
        const t=enemiesOf(p).sort((a,b)=>b.hand.length-a.hand.length)[0];
        if(t){await doHuankuan(p,t);acted=true;await sleep(600);continue;}
      }
      /* 舔狗：有队友时讨好队友（觉醒后此技失效，hasSkill 已返回 false） */
      if(hasSkill(p,'tiangou')&&customLeft(p,'tiangou')>0&&h.length){
        const t=alliesOf(p).sort((a,b)=>b.hp-a.hp)[0];
        if(t){await doTiangou(p,t,AI.chooseDiscard(p,1)[0]);acted=true;await sleep(600);continue;}
      }
      /* ---- 张峥 ---- */
      /* 二次元：血不满或手牌少时开形态 */
      if(hasSkill(p,'erciyuan')&&customLeft(p,'erciyuan')>0&&(p.ecyGame||0)<2&&!p.nijigen&&(p.hp<p.maxHp||h.length<=2)){
        await doErciyuan(p);acted=true;await sleep(620);continue;
      }
      /* 低气压：打手牌最多的敌人 */
      if(hasSkill(p,'diqiya')&&customLeft(p,'diqiya')>0){
        const t=enemiesOf(p).sort((a,b)=>b.hand.length-a.hand.length)[0];
        if(t&&(t.hand.length>=2||t.hp<=2)){await doDiqiya(p,t);acted=true;await sleep(600);continue;}
      }
      /* 十连：手牌差/少时赌一把 */
      if(hasSkill(p,'shilian')&&customLeft(p,'shilian')>0&&h.length&&h.length<=3&&!h.some(c=>c.name==='杀'||c.name==='闪')){
        await doShilian(p);acted=true;await sleep(760);continue;
      }
      /* 4. 装备 */
      const eq=h.find(c=>c.type==='equip'&&AI.shouldEquip(p,c));
      if(eq){await playFromHand(p,eq);acted=true;await sleep(480);continue;}
      /* 5. 无中生有 */
      const wz=h.find(c=>c.name==='无中生有');
      if(wz){await playFromHand(p,wz);acted=true;await sleep(600);continue;}
      /* 6. 酒（随后有杀可出） */
      const jiu=h.find(c=>c.name==='酒');
      if(jiu&&!p.drank&&h.some(c=>c.name==='杀')&&validShaTargets(p).some(t=>aiTargetScore(p,t)>0)){
        await playFromHand(p,jiu);acted=true;await sleep(480);continue;
      }
      /* 7. 乐不思蜀 */
      const le=h.find(c=>c.name==='乐不思蜀');
      if(le){const t=aiPickTarget(p,q=>!q.judges.some(j=>j.name==='乐不思蜀')&&aiTargetScore(p,q)>=40);
        if(t){await playFromHand(p,le,null,t);acted=true;await sleep(560);continue;}}
      /* 8. 兵粮寸断 */
      const bing=h.find(c=>c.name==='兵粮寸断');
      if(bing){const t=aiPickTarget(p,q=>distance(p,q)===1&&!q.judges.some(j=>j.name==='兵粮寸断')&&aiTargetScore(p,q)>=40);
        if(t){await playFromHand(p,bing,null,t);acted=true;await sleep(560);continue;}}
      /* 9. 过河拆桥：优先拆队友判定区延时锦囊 */
      const chai=h.find(c=>c.name==='过河拆桥');
      if(chai){
        let t=aliveList().find(q=>q!==p&&sameSide(p,q)&&q.judges.length>0);
        if(!t)t=aiPickTarget(p,q=>regionCards(q).length>0&&aiTargetScore(p,q)>0);
        if(t){await playFromHand(p,chai,null,t);acted=true;await sleep(560);continue;}
      }
      /* 10. 顺手牵羊 */
      const shun=h.find(c=>c.name==='顺手牵羊');
      if(shun){const t=aiPickTarget(p,q=>distance(p,q)===1&&regionCards(q).length>0&&aiTargetScore(p,q)>0);
        if(t){await playFromHand(p,shun,null,t);acted=true;await sleep(560);continue;}}
      /* 11. 决斗 */
      const juedou=h.find(c=>c.name==='决斗');
      if(juedou){const t=aiPickTarget(p,q=>!(hasSkill(q,'kongcheng')&&q.hand.length===0)&&aiTargetScore(p,q)>=50);
        if(t&&(h.filter(c=>c.name==='杀').length>=1||h.length>=t.hand.length)){
          await playFromHand(p,juedou,null,t);acted=true;await sleep(600);continue;}}
      /* 12. 南蛮 / 万箭 */
      const aoe=h.find(c=>c.name==='南蛮入侵'||c.name==='万箭齐发');
      if(aoe){
        const foes=enemiesOf(p);
        if(foes.length){
          const mine=[p,...alliesOf(p)];
          const avg=a=>a.reduce((s,x)=>s+x.hp,0)/a.length;
          if(p.identity==='renegade'||avg(mine)+0.4>=avg(foes)){await playFromHand(p,aoe);acted=true;await sleep(700);continue;}
        }
      }
      /* 13. 杀 */
      const unlimited=hasSkill(p,'paoxiao')||(p.equips.weapon&&p.equips.weapon.name==='诸葛连弩')||(hasSkill(p,'jdqs')&&(p.skillCount.jdqs||0)>0);
      if(unlimited||p.usedSha===0){
        const ts=validShaTargets(p).filter(t=>aiTargetScore(p,t)>0).sort((a,b)=>aiTargetScore(p,b)-aiTargetScore(p,a));
        const t=ts[0];
        if(t){
          const sha=h.find(c=>c.name==='杀');
          if(sha){await playFromHand(p,sha,null,t);acted=true;await sleep(560);continue;}
          if(hasSkill(p,'longdan')){const s=h.find(c=>c.name==='闪');if(s){await playFromHand(p,s,'杀',t);acted=true;await sleep(560);continue;}}
          if(hasSkill(p,'wusheng')){
            const c=h.find(x=>(x.suit==='♥'||x.suit==='♦')&&!['桃','无中生有','无懈可击','酒'].includes(x.name)&&x.type!=='equip');
            if(c){await playFromHand(p,c,'杀',t);acted=true;await sleep(560);continue;}
          }
        }
      }
    }
    log(`${nameHTML(p)} 结束出牌`);
  },
  shouldEquip(p,card){
    if(!p.equips[card.slot])return true;
    if(card.slot==='weapon'){
      const old=p.equips.weapon;
      if(card.name==='诸葛连弩'&&p.hand.filter(c=>c.name==='杀').length>=2)return true;
      if(card.name!=='诸葛连弩'&&card.range>old.range)return true;
    }
    return false;
  },
  rendePlan(p){
    const allies=alliesOf(p);if(!allies.length)return null;
    const t=[...allies].sort((a,b)=>(a.hp*2-a.hand.length)-(b.hp*2-b.hand.length))[0];
    const give=[];
    const tao=p.hand.find(c=>c.name==='桃'&&!give.includes(c));
    if(tao&&t.hp<=2)give.push(tao);
    const surplus=p.hand.length-p.hp;
    if(surplus>0){
      for(const nm of['闪','杀']){
        while(give.length<Math.max(1,surplus)){
          const c=p.hand.find(x=>x.name===nm&&!give.includes(x));if(!c)break;give.push(c);
        }
      }
    }
    return give.length?{cards:give,target:t}:null;
  },
  zhihengCards(p){
    const cands=p.hand.filter(c=>{
      if(['桃','闪','无懈可击'].includes(c.name))return false;
      if(c.name==='杀'&&validShaTargets(p).length)return false;
      if(['无中生有','乐不思蜀','南蛮入侵','万箭齐发','决斗','顺手牵羊','过河拆桥','兵粮寸断','酒'].includes(c.name))return false;
      if(c.type==='equip'&&!p.equips[c.slot])return false;
      return true;
    });
    return cands.slice(0,2);
  }
};

          const copies=DECK_RECIPE.filter(r=>r[0]===n);
          const suits=copies.map(r=>r[1]+rankText(r[2])).join(' ');
          const sub=m.type==='equip'?({weapon:'武器 · 攻击范围'+m.range,armor:'防具','horse+':'防御坐骑 +1马','horse-':'进攻坐骑 -1马'}[m.slot]):(m.kind==='delay'?'延时锦囊':m.kind==='aoe'?'群体锦囊':m.kind==='counter'?'即时锦囊':'');
          html+=`<div class="codex-card"><div class="cc-name">${n}<span class="cnt">×${copies.length}</span></div>
            <div class="cc-suit">${sub}　${suits}</div>
            <div class="cc-desc">${m.desc}</div></div>`;
        }
        html+='</div>';
      }
    }
    $('#codex-body').innerHTML=html;
  },

  /* ---------- 牌桌渲染 ---------- */
  render(){
    if(!G.players.length)return;
    try{
    const me=human();
    /* 其他席位：AI + 远程玩家（联机时远程玩家 isAI=false，不能按 isAI 过滤，否则好友武将不显示）
       座位必须按「以本机为起点逆时针绕桌一圈」的顺序排：DOM 里的 1~4 位依次是我+1、+2、+3、+4，
       再由 CSS 落到 右中→右上→左上→左中（见 #view-game.surround .ai-bench .seat:nth-child(n)）。
       否则屏幕上挨着你的座位和座号上挨着你的座位不是同一个 —— 会出现「顺手牵羊牵不到右边的人」这种距离错觉。 */
    const bench=$('#ai-bench');
    const _ord=tableOrderIndex(me);
    const ais=G.players.filter(p=>!p.local).sort((x,y)=>_ord(x)-_ord(y));
    setHTMLKeepAvatar(bench,ais.map(p=>this.seatHTML(p)).join(''));
    /* 玩家面板 */
    const panel=$('#player-panel');
    setHTMLKeepAvatar(panel,this.playerPanelHTML(me));
    /* 手牌：内容没变就不重建（手牌区 DOM 最重，一次十几个卡片节点） */
    const hcRoot=$('#hand-cards');
    const hhtml=me.alive?me.hand.map(c=>this.handCardHTML(me,c)).join(''):'<div style="color:#c98a7a;font-size:18px;letter-spacing:4px;">你已阵亡</div>';
    if(hcRoot._lastHTML!==hhtml){hcRoot._lastHTML=hhtml;hcRoot.innerHTML=hhtml;}
    /* 手牌过多时增大重叠，避免溢出 */
    const hc=$('#hand-cards');
    if(me.alive){
      const vw=(typeof window!=='undefined'&&window.innerWidth)||1280;
      const n=me.hand.length,cw=vw<=640?52:78,avail=hc.clientWidth||cw*8;
      let mg=cw===52?-11:-13;
      if(n>1){const overflow=n*cw-avail;if(overflow>0)mg=Math.max(cw===52?-38:-46,mg-overflow/(n-1));}
      hc.style.setProperty('--hm',mg+'px');
    }
    /* 装备槽 */
    $('#player-equips').innerHTML=EQUIP_SLOTS.map(([slot,label])=>{
      const c=me.equips[slot];
      return `<div class="eq-slot ${c?'filled':''}" title="${c?c.name+'：'+c.desc:label}">${c?equipSlotTxt(slot,c):label}</div>`;
    }).join('');
    /* 阶段 / 按钮 */
    const myTurn=G.turnSeat===me.seat&&!!G.playResolve&&me.alive;
    $('#btn-end').classList.toggle('disabled',!myTurn);
    $('#btn-cancel').classList.toggle('disabled',!G.selecting);
    const cur=P(G.turnSeat);
    $('#phase-banner').textContent=cur?`第 ${Math.ceil((G.turnCount+1)/G.players.length)} 轮 · ${generalOf(cur).name} 的回合`:'';
    this.renderPiles();this.renderLog();this.renderJudgeZone();
    paintTimerBars();   /* 席位刚被重建，进度条的显隐与宽度要按当前读秒状态重刷一次 */
    if(typeof NET!=='undefined'&&NET.hostActive)NET.onRender();
    }catch(e){
      console.error('[UI.render]',e);
      /* 渲染哪怕炸了也要把最新局况推给联机端：否则房主这边一崩就再也不广播，
         其他人的画面会永久停在崩的那一刻（表现为「卡住 / 状态全乱」）。 */
      try{if(typeof NET!=='undefined'&&NET.hostActive)NET.onRender();}catch(_){}
    }
  },
  renderPiles(){$('#deck-cnt').textContent=G.deck.length;$('#discard-cnt').textContent=G.discardPile.length;},
  renderJudgeZone(){
    const z=$('#judge-zone');if(!z)return;
    z.innerHTML=G.players.flatMap(p=>p.judges.map(c=>{
      const le=c.name==='乐不思蜀';
      return `<div class="judge-chip"><span class="jc-card ${le?'jc-le':'jc-bing'}">${le?'乐':'兵'}</span>${generalOf(p).name} · ${c.name}</div>`;

    const jades=Array.from({length:p.maxHp},(_,i)=>`<i class="jade ${i>=p.hp?'lost':''}"></i>`).join('');

    const judgeTags=p.judges.map(j=>`<span class="judge-tag ${j.name==='乐不思蜀'?'tag-le':'tag-bing'}">${j.name==='乐不思蜀'?'乐':'兵'}</span>`).join('');
    /* 对手装备区要显示「具体装了什么」：武器名 / 防具名 / +1马·名 / -1马·名，

    const eqs=EQUIP_SLOTS.map(([s,label])=>{

    }).join('');
    const targetable=G.selecting&&G.selecting.targets.includes(p.seat);
    /* 指定目标时显示距离，方便判断为什么某个人选不到（+1马/-1马/阵亡跳过都会改变距离） */
    let distTag='';

      }
    }
    const stateTags=`${p.flipped?'<span class="judge-tag tag-flip">翻面</span>':''}${p.sxcmMao?`<span class="judge-tag tag-mao">毛×${p.sxcmMao}</span>`:''}${(p.mic!=null&&p.mic>0)||hasSkill(p,'gy')?`<span class="judge-tag tag-mic">🎤×${p.mic||0}</span>`:''}${p.vocal?'<span class="judge-tag tag-mic">Vocal</span>':''}${p.rapDmg?'<span class="judge-tag tag-mic">Rap</span>':''}${p.dance?'<span class="judge-tag tag-mic">Dance</span>':''}${p.nijigen?'<span class="judge-tag tag-mic">二次元</span>':''}${p.awakened?'<span class="judge-tag tag-mic">觉醒</span>':''}${distTag}`;
    return `<div class="seat ${G.turnSeat===p.seat?'active':''} ${!p.alive?'dead':''} ${p.flipped?'flipped':''} ${targetable?'targetable':''}" data-seat="${p.seat}" onclick="Game.seatClick(${p.seat})">
      <div class="seat-top">
        <img class="seat-avatar" data-gid="${p.gid}" data-form="${formTag(p)}" src="${avatarImg(p)}">
        <div class="seat-info">
          <div class="seat-name"><span class="km" style="background:var(--${g.kingdom})">${KINGDOM_NAME[g.kingdom]}</span>${g.name}</div>
          <div class="seat-hp">${jades}</div>
          <div class="seat-meta"><span class="hand-count">手牌 ${p.hand.length}</span>${idBadge}</div>
          <div class="judge-tags">${judgeTags}${stateTags}</div>
        </div>
      </div>
      <div class="equip-row">${eqs}</div>
      <div class="turn-bar-wrap" data-timerbar="${p.seat}"><i class="turn-bar"></i><span class="turn-sec"></span></div>
    </div>`;
  },
  playerPanelHTML(p){
    const g=generalOf(p);
    const jades=Array.from({length:p.maxHp},(_,i)=>`<i class="jade ${i>=p.hp?'lost':''}"></i>`).join('');
    const idBadge=G.mode==='identity'?`<span class="identity-badge id-${p.identity}">${ID_TEXT[p.identity]}</span>`:'';
    const sbtns=g.skills.filter(s=>s.type==='active'||s.type==='lord'||(s.type==='locked'&&hasSkill(p,s.key))).map(s=>{
      const inTurn=(G.turnSeat===p.seat&&G.playResolve);
      let usable=inTurn&&!p.skillUsed[s.key]&&!p.flipped;  /* 翻面时技能全部失效，按钮置灰 */
      if(s.key==='jijiang'&&inTurn&&p.usedSha>=1&&!(hasSkill(p,'paoxiao')||(p.equips.weapon&&p.equips.weapon.name==='诸葛连弩')))usable=false;
      if(s.key==='hujia')usable=false; // 护驾在响应弹窗中发动，面板按钮仅作说明入口
      if(CUSTOM_SKILL_LIMIT[s.key]!==undefined&&customLeft(p,s.key)<=0)usable=false;
      if(s.key==='dyzt'&&(p.cdDyzt||0)>0)usable=false;
      /* 张峥 / 张嵘：次数与前置条件 */
      if(s.key==='erciyuan'&&(p.ecyGame||0)>=2)usable=false;
      if(s.key==='juexing'&&(p.awakened||p.hp>2))usable=false;
      if(s.key==='tiangou'&&p.awakened)usable=false;
      if(s.key==='zian'&&!p.awakened&&p.hp>=p.maxHp)usable=false;
      const cnt=CUSTOM_SKILL_LIMIT[s.key]?` <span class="sk-cnt">${Math.max(0,customLeft(p,s.key))}/${CUSTOM_SKILL_LIMIT[s.key]}</span>`:'';
      const cdTag=(s.key==='dyzt'&&(p.cdDyzt||0)>0)?` <span class="sk-cnt">冷却${p.cdDyzt}</span>`:'';
      const action=usable?`skillClick('${s.key}')`:`skillInfo('${s.key}')`;
      /* 觉醒后失效的技能打上 ✕，一眼看出「这个已经不能用了」 */
      const deadTag=(p.awakened&&(s.key==='tiangou'||s.key==='fengxin'))?`<span class="sk-cnt">✕</span>`:'';
      return `<button class="skill-btn ${usable?'':'sk-off'}" title="${s.desc}（点击查看说明）" onclick="Game.${action}">${s.name}${cnt}${cdTag}${deadTag}</button>`;
    }).join('');
    /* 锁定技 + 尚未解锁的觉醒技（自强/梭哈）都显示为灰色说明按钮 */
    const passive=g.skills.filter(s=>(s.type!=='active'&&s.type!=='lord'&&s.type!=='locked')||(s.type==='locked'&&!hasSkill(p,s.key)))
      .map(s=>`<button class="skill-btn sk-off" title="${s.desc}（点击查看说明）" onclick="Game.skillInfo('${s.key}')">${s.type==='locked'?s.name+'（未解锁）':s.name}${s.type==='locked'||(p.awakened&&(s.key==='tiangou'||s.key==='fengxin'))?`<span class="sk-cnt">✕</span>`:''}</button>`).join('');
    /* 本机玩家的状态标记：翻面 / 毛标记 / 麦克风数 —— 让「自己被翻面了」一眼可见 */
    const stateTags=`${p.flipped?'<span class="judge-tag tag-flip">翻面</span>':''}${p.sxcmMao?`<span class="judge-tag tag-mao">毛×${p.sxcmMao}</span>`:''}${(p.mic!=null&&p.mic>0)||hasSkill(p,'gy')?`<span class="judge-tag tag-mic">🎤×${p.mic||0}</span>`:''}${p.vocal?'<span class="judge-tag tag-mic">Vocal</span>':''}${p.rapDmg?'<span class="judge-tag tag-mic">Rap</span>':''}${p.dance?'<span class="judge-tag tag-mic">Dance</span>':''}${p.nijigen?'<span class="judge-tag tag-mic">二次元</span>':''}${p.awakened?'<span class="judge-tag tag-mic">觉醒</span>':''}`;
    return `<img data-gid="${p.gid}" data-form="${formTag(p)}" src="${avatarImg(p)}" ${p.flipped?'style="transform:rotate(180deg);filter:grayscale(.6) brightness(.75);"':''}>
      <div class="gp-name"><span class="km" style="background:var(--${g.kingdom});font-size:10px;padding:1px 5px;border-radius:2px;color:#fff;">${KINGDOM_NAME[g.kingdom]}</span>${g.name} ${idBadge}</div>
      <div class="gp-hp">${jades}</div>
      <div class="gp-turnbar" data-timerbar="${p.seat}"><i class="turn-bar"></i><span class="turn-sec"></span></div>
      ${stateTags?`<div class="judge-tags" style="margin:2px 0;">${stateTags}</div>`:''}
      <div class="skill-btns">${sbtns}${passive}</div>`;
  },
  handCardHTML(me,c){
    let playable=false,vname=null;
    if(G.playResolve&&G.turnSeat===me.seat&&!G.busy){
      if(c.name==='桃'&&hasSkill(me,'jt')){playable=canPlay(me,c,'杀').ok;}  /* 禁桃：桃按杀判断是否可用 */
      else{
        const r=canPlay(me,c);
        if(r.ok)playable=true;
        else{
          if(c.name==='闪'&&hasSkill(me,'longdan'))playable=canPlay(me,c,'杀').ok;
          else if(hasSkill(me,'wusheng')&&(c.suit==='♥'||c.suit==='♦')&&c.name!=='杀'&&canPlay(me,c,'杀').ok)playable=true;
        }
      }
    }
    const selected=G.selecting&&G.selecting.uid===c.uid?'picked-card':'';
    return cardEl(c,{playable,cls:selected});
  },
  renderLog(){
    const box=$('#log-box');
    if(!box)return;
    /* log() 每写一条都会调这里，UI.render() 又会再调一次；日志没有新增就直接跳过，
       否则每回合几十次重建整段日志 HTML（还带样式/滚动），白白吃掉大量 CPU。 */
    const n=G.log.length,last=G.log[n-1];
    const key=n+':'+(last?last.t:0);
    if(box._key===key)return;
    box._key=key;
    box.innerHTML=G.log.slice(-40).map(l=>`<p class="${l.imp?'imp':''}">${l.msg}</p>`).join('');
    box.scrollTop=box.scrollHeight;
  },
  float(txt,cls){
    const f=$('#floats');
    const el=document.createElement('div');
    el.className='float-word '+(cls||'');el.textContent=txt;
    f.appendChild(el);setTimeout(()=>el.remove(),1500);
  },
  setTip(t){$('#tip-line').textContent=t;},

  /* ---------- 判定牌快显 ---------- */
  showJudge(card){

    pop.style.display='block';

  hideJudge(){const pop=$('#judge-pop');if(pop)pop.style.display='none';if(typeof NET!=='undefined'&&NET.hostActive)NET.broadcast({k:'judgeHide'});}
};
/* ==================== 卡牌 DOM ==================== */
function cardSubText(c){
  if(c.type==='equip')return c.slot==='weapon'?'攻击范围 '+c.range:c.slot==='armor'?'防 具':c.slot==='horse+'?'+1 防御马':'-1 进攻马';
  if(c.type==='trick')return c.kind==='delay'?'延时锦囊':'锦 囊';
  return '';
}
function cardEl(c,opts={}){
  const colorCls=suitColor(c.suit)==='red'?'red-name':'';
  const via=opts.via?`<div style="position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:9px;color:#2a5a8a;font-weight:700;">${opts.via}</div>`:'';
  const attrs=[`data-uid="${c.uid}"`];
  if(opts.idx!==undefined)attrs.push(`data-idx="${opts.idx}"`);
  if(opts.pidx!==undefined)attrs.push(`data-pidx="${opts.pidx}"`);
  if(opts.onclick)attrs.push(`onclick="${opts.onclick}"`);
  return `<div class="card type-${c.type} ${colorCls} ${opts.small?'small':''} ${opts.playable?'playable':''} ${opts.selectable?'selectable':''} ${opts.picked?'picked':''} ${opts.cls||''}" ${attrs.join(' ')}>
    <div class="corner ${suitColor(c.suit)}"><span class="rank">${rankText(c.rank)}</span>${c.suit}</div>
    <div class="cname">${opts.name||c.name}</div>
    <div class="cart">${c.icon||''}</div>${via}
    <div class="csub">${opts.sub!==undefined?opts.sub:cardSubText(c)}</div>
  </div>`;
}
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2100);
  if(typeof NET!=='undefined'&&NET.hostActive&&G.actor&&G.actor.remote)NET.sendTo(G.actor.seat,{k:'toast',msg});
}
function openModal(html){$('#modal-layer').classList.remove('hidden');$('#modal-box').innerHTML=html;}
function closeModal(){$('#modal-layer').classList.add('hidden');$('#modal-box').innerHTML='';G.mres=null;stopModalTimer();}
function resolveModal(v){
  if(NET.clientMode&&NET.currentAsk){const a=NET.currentAsk;closeModal();NET.sendAnswer(a,v);return;}
  const r=G.mres;closeModal();if(r)r(v);
}

/* ==================== 玩家交互控制 ==================== */
/* 联机：远程玩家的 UI 弹窗走网络 */
async function pickCardsFor(p,title,cards,opt){
  if(p.remote)return NET.askRemote(p,'pickCards',[title,cards,opt]);
  return UI.pickCards(title,cards,opt);
}
async function pickSeatFor(p,title,players){
  if(p.remote)return NET.askRemote(p,'pickSeat',[title,players]);
  return UI.pickSeat(title,players);
}
const Game={
  handClick(uid){
    if(G.busy){return;}
    if(G.actor&&G.actor.remote&&!G._netAct)return; // 远程玩家回合，本地点击无效
    const me=G.actor||human();
    if(!me.alive)return;
    if(!G.playResolve||G.turnSeat!==me.seat){toast('现在不是你的出牌阶段');return;}
    uid=Number(uid);
    const card=me.hand.find(c=>c.uid===uid);if(!card)return;
    let r=canPlay(me,card),vname=null;
    if(card.name==='桃'&&hasSkill(me,'jt')){vname='杀';r=canPlay(me,card,vname);}  /* 禁桃：桃强制视为杀 */
    else if(!r.ok){
      if(card.name==='闪'&&hasSkill(me,'longdan'))vname='杀';
      else if(hasSkill(me,'wusheng')&&(card.suit==='♥'||card.suit==='♦')&&card.name!=='杀')vname='杀';
      if(vname)r=canPlay(me,card,vname);
    }
    if(!r.ok){toast(r.reason);return;}
    if(r.needTarget){
      G.selecting={uid,vname,targets:r.targets.map(t=>t.seat)};
      UI.render();UI.setTip('选择目标：点击上方高亮角色；点"取消"放弃');
    }else{
      G.selecting=null;playFromHand(me,card,vname);
    }
  },
  seatClick(seat){
    const sel=G.selecting;
    if(!sel){
      /* 联机时：客户端刚点了手牌、目标高亮状态还没同步过来就点了座位（竞态），
         房主这边不要弹「武将详情」把房主界面挡住 —— 直接忽略这次转发点击 */
      if(G._netAct)return;
      UI.generalDetail(P(seat).gid);return;
    } // 非选目标时：点击武将查看技能详情
    if(G.actor&&G.actor.remote&&!G._netAct)return; // 远程玩家的选择，本地不可代点
    if(!sel.targets.includes(seat)){
      /* 说清楚为什么选不到：距离（含 +1/-1 马修正）还是状态限制 */
      const t=P(seat),me0=G.actor||human();
      if(t&&me0&&t!==me0){
        const vn=sel.vname||((me0.hand.find(c=>c.uid===sel.uid)||{}).name)||'该牌';
        toast(`【${generalOf(t).name}】不能作为【${vn}】的目标：距离 ${distance(me0,t)}`+((t.alive)?'':'（已阵亡）'));
      }else toast('该目标不合法（距离或状态限制）');
      return;
    }
    const me=G.actor||human();
    G.selecting=null;
    if(sel.jijiang)return Game.doJijiang(P(seat));
    const card=me.hand.find(c=>c.uid===sel.uid);
    const vname=sel.vname;
    if(card)playFromHand(me,card,vname,P(seat));
  },
  /* ---------- 联机聊天：输入框发消息（房主与好友互发） ---------- */
  sendChat(){
    const inp=document.getElementById('chat-text');if(!inp)return;
    const txt=String(inp.value||'').trim().slice(0,40);
    if(!txt)return;
    /* 诊断指令：输入 /sfx 把本机音效状态打进聊天框，用于远程定位「好友听不到」 */
    if(txt==='/sfx'||txt==='/音效'){inp.value='';
      try{UI.chat('系统',SFX.diagText(),true);toast('自检结果已发到聊天框');}catch(e){}
      return;}
    const now=Date.now();
    if(this._lastChat&&now-this._lastChat<600)return toast('发太快啦，慢一点~');
    this._lastChat=now;
    inp.value='';
    if(typeof NET!=='undefined'&&NET.clientMode&&!NET.hostActive){
      NET.sendTo(0,{k:'chat',text:txt});            /* 客机 → 房主转发 */
    }else if(typeof NET!=='undefined'&&NET.hostActive){
      NET.hostChat(human()?human().seat:0,txt);     /* 房主自己发 */
    }else{
      UI.chat((human()?generalOf(human()).name:'我'),txt);   /* 单机：只给自己看 */
    }
  },
  async doJijiang(target){
    const me=G.actor||human();
    G.busy=true;UI.render();
    let arrow=null;
    try{
      const ans=await lordProxy(me,'杀');
      if(!ans){toast('没有蜀势力武将能替你打出【杀】');}
      else{
        FX.playCard(me,ans.card,target);arrow=FX.arrow(me,target);
        SFX.card('杀',ans.card,me);
        await shaFlow(me,target,ans.card);
      }
    }finally{if(arrow)FX.fadeArrow(arrow);G.busy=false;UI.render();if(G.playResolve)UI.setTip(playTip(me));}
  },
  cancelAction(){if(G.actor&&G.actor.remote&&!G._netAct)return;if(G.selecting){G.selecting=null;UI.render();UI.setTip('已取消目标选择');}},
  onEndTurnClick(){
    if(G.actor&&G.actor.remote&&!G._netAct)return; // 不可替远程玩家结束回合
    const me=G.actor||human();
    if(!G.playResolve||G.turnSeat!==me.seat||G.busy)return;
    G.selecting=null;finishPlayPhase();
  },
  skillInfo(key){
    const me=human();const g=generalOf(me);
    if(key)UI.generalDetail(me.gid);
  },
  async skillClick(key){
    const me=G.actor||human();
    if(G.actor&&G.actor.remote&&!G._netAct)return; // 远程回合本地不可点技能
    if(G.busy||!G.playResolve||G.turnSeat!==me.seat){toast('当前不能发动技能');return;}
    /* 翻面（定燕子朝天）状态下所有技能失效 —— hasSkill 虽已有此判断，
       但技能按钮不走 hasSkill，必须在这里拦一道（翻面后吴海湘开挂仍能放技能就是这个洞） */
    if(me.flipped){toast('你处于【翻面】状态，所有技能失效（受到伤害后翻回）');return;}
    if(key==='hujia'){toast('【护驾】是防御主公技：当你需要打出闪时，在响应弹窗中点击"护驾（魏将代出）"');return;}
    if(key==='jijiang'){
      if(me.usedSha>=1&&!(hasSkill(me,'paoxiao')||(me.equips.weapon&&me.equips.weapon.name==='诸葛连弩')))
        return toast('本回合的出杀次数已用完');
      const targets=validShaTargets(me);
      if(!targets.length)return toast('攻击范围内没有可使用杀的目标');
      G.selecting={jijiang:true,targets:targets.map(t=>t.seat)};
      UI.render();UI.setTip('【激将】选择杀的目标：蜀势力武将将依次决定是否替你打出；点"取消"放弃');
      return;
    }
    /* 自创武将技能 */
    if(key==='jjm'||key==='wqdd'||key==='jbrm'||key==='pycg'||key==='hjlb'||key==='jdqs'||key==='dyzt'||key==='sxcm'
       ||key==='diqiya'||key==='erciyuan'||key==='shilian'
       ||key==='tiangou'||key==='juexing'||key==='zian'||key==='ziqiang'||key==='suoha'||key==='huankuan'){
      if(key==='dyzt'){if((me.cdDyzt||0)>0)return toast('【定燕子朝天】冷却中，还需 '+me.cdDyzt+' 回合');}
      else if(key==='erciyuan'){if((me.ecyGame||0)>=2)return toast('【二次元】每局限两次，已用完');}
      else if(key==='juexing'){
        if(me.awakened)return toast('你已处于觉醒形态');
        if(me.hp>2)return toast('【觉醒】需在体力不大于 2 时才能发动');
      }
      else if(key==='tiangou'&&me.awakened)return toast('觉醒后【舔狗】已失效');
      else if(customLeft(me,key)<=0)return toast('【'+skillName(me,key)+'】本回合使用次数已用完');
      if((key==='wqdd'||key==='pycg')&&!othersAlive(me).length)return toast('场上没有其他角色');
      if(key==='jdqs'&&me.hp>1)return toast('【绝地求生】需在体力为 1 时才能发动');
      G.busy=true;
      try{
        if(key==='jjm')doJjm(me);
        else if(key==='wqdd')await doWqdd(me);
        else if(key==='jbrm')await doJbrm(me);
        else if(key==='pycg')await doPycg(me);
        else if(key==='jdqs')doJdqs(me);
        else if(key==='dyzt'){
          const list=othersAlive(me);
          if(!list.length){toast('场上没有其他角色');return;}
          const t=await pickSeatFor(me,'【定燕子朝天】选择要翻面的角色（其技能全部失效，受伤后翻回）',list);
          if(!t)return;
          await doDyzt(me,t);
        }
        else if(key==='sxcm'){
          const list=othersAlive(me);
          if(!list.length){toast('场上没有其他角色');return;}
          const t=await pickSeatFor(me,'【思想长毛】选择目标角色',list);
          if(!t)return;
          const cards=await pickCardsFor(me,'【思想长毛】选择要弃置的手牌（1~2 张，目标获得等量「毛」，毛达 2 根自动乐不思蜀）',me.hand,{min:1,max:2,confirmText:'弃置长毛'});
          if(!cards||!cards.length)return;
          await doSxcm(me,t,cards);
        }
        else if(key==='hjlb'){
          const list=othersAlive(me);
          if(list.length<2){toast('【皇家礼炮】需要至少两名其他角色在场');return;}
          const t1=await pickSeatFor(me,'【皇家礼炮】选择第 1 名角色',list);
          if(!t1)return;
          const t2=await pickSeatFor(me,'【皇家礼炮】选择第 2 名角色（与第 1 名互换手牌）',list.filter(x=>x!==t1));
          if(!t2)return;
          await doHjlb(me,t1,t2);
        }
        /* ---- 张峥 ---- */
        else if(key==='diqiya'){
          const list=othersAlive(me);
          if(!list.length){toast('场上没有其他角色');return;}
          const t=await pickSeatFor(me,'【低气压】选择被压制的角色（其弃 2 张手牌，不足则受 1 点伤害）',list);
          if(!t)return;
          await doDiqiya(me,t);
        }
        else if(key==='erciyuan'){await doErciyuan(me);}
        else if(key==='shilian'){await doShilian(me);}
        /* ---- 张嵘 ---- */
        else if(key==='juexing'){await doJuexing(me);}
        else if(key==='tiangou'){
          const list=othersAlive(me);
          if(!list.length){toast('场上没有其他角色');return;}
          if(!me.hand.length){toast('【舔狗】需要弃置一张手牌');return;}
          const c=await pickCardsFor(me,'【舔狗】选择要弃置的手牌',me.hand,{min:1,max:1,confirmText:'下一步：选择角色'});
          if(!c||!c.length)return;
          const t=await pickSeatFor(me,'【舔狗】选择要讨好的角色（其摸两张牌）',list);
          if(!t)return;
          await doTiangou(me,t,c[0]);
        }
        else if(key==='zian'){
          if(!me.hand.length){toast('【自爱】需要弃置一张手牌');return;}
          if(me.hp>=me.maxHp&&!me.awakened){toast('体力已满，无需使用自爱');return;}
          const c=await pickCardsFor(me,'【自爱】选择要弃置的手牌（回复 1 点体力'+(me.awakened?'，觉醒后改为回复 2 点并摸 1 张':'')+'）',me.hand,{min:1,max:1,confirmText:'自爱'});
          if(!c||!c.length)return;
          await doZian(me,c[0]);
        }
        else if(key==='ziqiang'){await doZiqiang(me);}
        else if(key==='suoha'){
          const ok=me.isAI?true:await UI.yesNo('【梭哈】','将弃置所有手牌，对所有其他角色各造成 1 点伤害，然后摸一张牌。确定 ALL IN？');
          if(!ok)return;
          await doSuoha(me);
        }
        else if(key==='huankuan'){
          const list=othersAlive(me);
          if(!list.length){toast('场上没有其他角色');return;}
          const t=await pickSeatFor(me,'【还款】选择催收对象（其交给你一张手牌，无牌则受 1 点伤害）',list);
          if(!t)return;
          await doHuankuan(me,t);
        }
      }finally{G.busy=false;resetTimer();UI.render();if(G.playResolve&&!G.selecting)UI.setTip(playTip(me));}
      return;
    }
    G.busy=true;
    try{
    if(key==='rende'){
      if(me.skillUsed.rende)return toast('仁德本回合已发动过');
      if(!othersAlive(me).length)return;
      const cards=await pickCardsFor(me,'【仁德】选择要交给其他角色的手牌（至少1张）',me.hand,{min:1,max:99,confirmText:'下一步：选择角色'});
      if(!cards||!cards.length)return;
      const t=await pickSeatFor(me,'【仁德】选择获得手牌的角色',othersAlive(me));
      if(!t)return;
      await doRende(me,cards,t);
    }
    if(key==='zhiheng'){
      if(me.skillUsed.zhiheng)return toast('制衡本回合已发动过');
      const pool=[...me.hand,...EQUIP_SLOTS.map(([s])=>me.equips[s]).filter(Boolean)];
      const cards=await pickCardsFor(me,'【制衡】选择要弃置的牌（手牌或装备），摸等量的牌',pool,{min:1,max:99,confirmText:'制衡'});
      if(!cards||!cards.length)return;
      await doZhiheng(me,cards);
    }
    }finally{G.busy=false;resetTimer();UI.render();if(G.playResolve&&!G.selecting)UI.setTip(playTip(me));}
  }
};

/* ==================== UI：弹窗集合 ==================== */
Object.assign(UI,{
  /* ---------- 响应询问（杀/闪/桃/无懈） ---------- */
  askHuman(p,ctx){
    return new Promise(res=>{
      G.mres=res;
      const need=ctx.need;let title,desc,opts=[],extra='';
      if(need==='桃'){
        const t=ctx.dyingTarget;
        /* 禁桃（杨浩展）：桃在他手里是【杀】，不能当桃用（既不能救人也不能自救），只有【酒】能救自己 */
        const jt=hasSkill(p,'jt');
        title=t===p?(jt?'濒 死 求 救':'濒 死 求 桃'):generalOf(t).name+' 濒死';
        desc=t===p?(jt?'你体力不支：【禁桃】使你的【桃】均视为【杀】，只有【酒】能让你回复1点体力，否则将阵亡。':'你体力不支：使用【桃】或【酒】回复1点体力，否则将阵亡。')
                   :`是否使用【桃】为 ${generalOf(t).name} 回复1点体力？（酒不可用于他人）`;
        opts=p.hand.filter(c=>(!jt&&c.name==='桃')||(t===p&&c.name==='酒')).map(c=>({card:c}));
        if(jt&&t!==p)desc='【禁桃】：你的【桃】均视为【杀】，无法救他人。';
      }else if(need==='无懈'){
        title='无 懈 可 击';
        desc=`${ctx.caster?generalOf(ctx.caster).name+' ':''}的【${ctx.trick.name}】即将对 ${ctx.target?generalOf(ctx.target).name+' ':''}生效，是否打出【无懈可击】抵消？`;
        opts=p.hand.filter(c=>c.name==='无懈可击').map(c=>({card:c}));
      }else{
        opts=responseOptions(p,need);
        if(need==='闪'){title='请 打 出 闪';desc=`${ctx.source?generalOf(ctx.source).name+' 的'+(ctx.reason==='sha'?'【杀】':'【万箭齐发】'):''}需要你打出一张【闪】，否则受到1点伤害。`;}
        else{title=ctx.reason==='duel'?'决 斗 · 出 杀':'南 蛮 入 侵 · 出 杀';
          desc=ctx.reason==='duel'?`${generalOf(ctx.source).name} 与你【决斗】：请打出一张【杀】，否则受到1点伤害。`:'【南蛮入侵】：请打出一张【杀】，否则受到1点伤害。';}
        if(need==='杀'&&hasSkill(p,'jijiang'))extra+=`<button class="btn" onclick="UI.respLord('杀')">激将（蜀将代出）</button>`;
        if(need==='闪'&&hasSkill(p,'hujia'))extra+=`<button class="btn" onclick="UI.respLord('闪')">护驾（魏将代出）</button>`;
      }
      const cards=opts.map((o,i)=>cardEl(o.card,{selectable:true,name:o.virtualName,via:o.via,cls:'pick-resp',small:true,idx:i})).join('');
      openModal(`<h3>${title}</h3><div class="m-desc">${desc}</div>
        <div class="pick-cards">${cards||'<div style="color:#b89d6b;font-size:13px;">没有可打出的牌</div>'}</div>
        <div class="modal-actions">${extra}
        <button class="btn ghost" onclick="UI.respGiveup()">${need==='桃'?'不使用':'放弃（承受后果）'}</button></div>`);
      G.respOpts=opts;
      /* 响应读秒：15 秒不作回应即视为放弃（不出闪 / 杀 / 桃 / 无懈都按放弃结算） */
      armTimer('respond',p.seat,()=>{
        log(`${nameHTML(p)} 响应超时，视为放弃`,true);
        modalTimeout();
      });
      runTimer();
    });
  },
  respPick(idx){const o=G.respOpts[idx];resolveModal(o);},
  respGiveup(){resolveModal(null);},
  async respLord(need){
    const p=human();
    if(NET.clientMode){
      NET._lordSaved=$('#modal-box').innerHTML;
      openModal(`<h3>${need==='杀'?'激 将':'护 驾'}</h3><div class="m-desc">正在询问${need==='杀'?'蜀势力':'魏势力'}武将是否替你打出【${need}】……</div>`);
      NET.act({act:'respLord',need});
      return;
    }
    const saved=$('#modal-box').innerHTML; // 保存原响应弹窗，无人代出时恢复
    openModal(`<h3>${need==='杀'?'激 将':'护 驾'}</h3><div class="m-desc">正在询问${need==='杀'?'蜀势力':'魏势力'}武将是否替你打出【${need}】……</div>`);
    const ans=await lordProxy(p,need);
    if(ans){const r=G.mres;closeModal();if(r)r(ans);}
    else{
      $('#modal-box').innerHTML=saved; // 恢复弹窗，玩家仍可自行打出或放弃
      toast('没有武将能替你打出，请自行打出或点"放弃"');
    }
  },

  /* ---------- 通用二选一 / 多选一 ---------- */
  yesNo(title,desc){return new Promise(res=>{G.mres=res;
    openModal(`<h3>${title}</h3><div class="m-desc">${desc}</div>
      <div class="modal-actions"><button class="btn primary" onclick="resolveModal(true)">发 动</button>
      <button class="btn ghost" onclick="resolveModal(false)">不发动</button></div>`);});},
  chooseAction(title,actions,desc){return new Promise(res=>{G.mres=res;
    openModal(`<h3 style="font-size:22px">${title}</h3>${desc?`<div class="m-desc">${desc}</div>`:''}
      <div class="modal-actions">
      ${actions.map(a=>`<button class="btn ${a.disabled?'disabled':'primary'}" ${a.disabled?'disabled':''} onclick="resolveModal('${a.v}')">${a.t}</button>`).join('')}
    </div>`);});},

  /* ---------- 多选手牌（弃牌/仁德/制衡） ---------- */
  pickCards(title,cards,opt={}){return new Promise(res=>{
    G.mres=res;G.pick={sel:new Set(),cards,opt};
    const body=cards.map((c,i)=>cardEl(c,{small:true,selectable:true,pidx:i})).join('');
    const cancel=opt.force?'':`<button class="btn ghost" onclick="resolveModal(null)">取消</button>`;
    openModal(`<h3 style="font-size:22px">${title}</h3>
      <div class="m-desc">${opt.min===opt.max?`需选择 ${opt.min} 张`:`选择 ${opt.min||1}${opt.max&&opt.max<99?'～'+opt.max:' 张以上'}`}（点击选中/取消）</div>
      <div class="pick-cards">${body}</div>
      <div class="modal-actions"><button class="btn primary" id="pick-ok" onclick="UI.pickConfirm()">${opt.confirmText||'确 定'}</button>${cancel}</div>`);
  });},
  pickToggle(){},
  pickConfirm(){
    const {sel,cards,opt}=G.pick;
    const n=sel.size;
    if(opt.min&&n<opt.min)return toast('至少选择 '+opt.min+' 张');
    if(opt.max&&n>opt.max)return toast('至多选择 '+opt.max+' 张');
    resolveModal(cards.filter((_,i)=>sel.has(i)));
  },

  /* ---------- 选角色 ---------- */
  pickSeat(title,players){return new Promise(res=>{G.mres=res;
    openModal(`<h3 style="font-size:22px">${title}</h3><div class="pick-seats">
      ${players.map(p=>`<div class="pick-seat" onclick="resolveModal(G_P(${p.seat}))">
        <img src="${assetImg(generalOf(p).img)}"><div class="pn">${generalOf(p).name}</div>
        <div style="font-size:11px;color:#b89d6b;">体力 ${p.hp} · 手牌 ${p.hand.length}</div></div>`).join('')}
    </div><div class="modal-actions"><button class="btn ghost" onclick="resolveModal(null)">取消</button></div>`);
  });},

  /* ---------- 选择目标区域牌（拆/牵/反馈/寒冰） ---------- */
  chooseRegionHuman(actor,target,forceRandom,title){return new Promise(res=>{
    G.mres=res;G.regionTarget=target;
    const reg=regionCards(target);
    const equipBtns=EQUIP_SLOTS.map(([slot,label])=>{
      const item=reg.find(r=>r.place==='equip'&&r.slot===slot);
      if(!item)return '';
      return `<button class="btn small" onclick="UI.regionPick('equip','${slot}')">${item.card.name}（${label}）</button>`;
    }).join('');
    const judgeBtns=target.judges.map((j,i)=>`<button class="btn small" onclick="UI.regionPick('judges',null,${i})">${j.name}（判定区）</button>`).join('');
    const handN=target.hand.length;
    openModal(`<h3 style="font-size:21px">${title||'选择一张牌'}</h3>
      <div class="m-desc">目标：${generalOf(target).name}（体力 ${target.hp}）。装备与判定牌明示，手牌随机获得。</div>
      <div class="modal-actions" style="flex-direction:column;align-items:stretch;max-width:340px;margin:0 auto;">
        ${judgeBtns?`<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px">${judgeBtns}</div>`:''}
        ${equipBtns?`<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px">${equipBtns}</div>`:''}
        ${handN?`<button class="btn primary" onclick="UI.regionPick('hand')">随机手牌（${handN} 张）</button>`:'<div class="m-desc">目标已无手牌</div>'}
      </div>
      <div class="modal-actions"><button class="btn ghost" onclick="resolveModal(null)">取消</button></div>`);
  });},
  regionPick(place,slot,ji){
    if(NET.clientMode&&NET.currentAsk){const a=NET.currentAsk;closeModal();NET.sendAnswer(a,{place,slot,ji});return;}
    const target=G.regionTarget;const reg=regionCards(target);
    let item=null;
    if(place==='hand'){const h=reg.filter(r=>r.place==='hand');item=h[rnd(h.length)];}
    else if(place==='equip')item=reg.find(r=>r.place==='equip'&&r.slot===slot);
    else if(place==='judges')item=reg.find(r=>r.place==='judges'&&r.card.uid===target.judges[ji].uid);
    resolveModal(item);
  },

  /* ---------- 观星 ---------- */
  guanxingHuman(cards){return new Promise(res=>{
    G.mres=res;G.gx={top:[...cards],bottom:[],sel:null,selZone:null};
    UI.gxRender();
  });},
  gxRender(){
    const gx=G.gx;
    const row=(zone,arr,label)=>`<div class="guanxing-row" id="gx-${zone}">
      <div class="gr-label">${label}</div>
      ${arr.map((c,i)=>cardEl(c,{small:true,picked:gx.selZone===zone&&gx.sel===i,onclick:`UI.gxClick('${zone}',${i})`})).join('')||'<div class="gr-label" style="color:#6b5028;">（空）</div>'}
    </div>`;
    openModal(`<h3>观 星</h3><div class="m-desc">点击两张<b>牌堆顶</b>的牌可交换顺序；选中后点"置于牌堆底"移动；点牌堆底的牌收回。牌堆顶最左侧的牌最先摸到。</div>
      <div class="guanxing-area">${row('top',gx.top,'牌 堆 顶（按此顺序摸牌）')}${row('bottom',gx.bottom,'牌 堆 底')}</div>
      <div class="modal-actions">
        <button class="btn" onclick="UI.gxToBottom()">选中 → 牌堆底</button>
        <button class="btn primary" onclick="UI.gxConfirm()">确 认</button>
      </div>`);
  },
  gxClick(zone,i){
    const gx=G.gx;
    if(zone==='bottom'){gx.top.push(gx.bottom.splice(i,1)[0]);UI.gxRender();return;}
    if(gx.selZone==='top'&&gx.sel===i){gx.sel=null;gx.selZone=null;}
    else if(gx.selZone==='top'){const a=gx.top[gx.sel];gx.top[gx.sel]=gx.top[i];gx.top[i]=a;gx.sel=null;gx.selZone=null;}
    else{gx.sel=i;gx.selZone='top';}
    UI.gxRender();
  },
  gxToBottom(){const gx=G.gx;if(gx.selZone!=='top')return toast('先在牌堆顶点选一张牌');
    gx.bottom.push(gx.top.splice(gx.sel,1)[0]);gx.sel=null;gx.selZone=null;UI.gxRender();},
  gxConfirm(){const gx=G.gx;resolveModal({top:gx.top,bottom:gx.bottom});},

  yijiDistribute(p,got){return new Promise(res=>{

      <div class="pick-cards">${cards||'<div class="m-desc">已全部分配</div>'}</div>
      <div class="modal-actions">
        ${targets.map(t=>`<button class="btn small" onclick="UI.yjGive(${t.seat})">交给 ${generalOf(t).name}</button>`).join('')}
        <button class="btn primary" onclick="UI.yjKeep()">全部自留</button>

  },
  yjToggle(i){const s=G.yj.sel;s.has(i)?s.delete(i):s.add(i);UI.yjRender();},
  yjGive(seat){

      log(`你发动【遗计】，将 ${c.name} 交给 ${generalOf(t).name}`);}

  /* ---------- 鬼才改判（玩家司马懿） ---------- */

/* ==================== 联机模块（房主权威 + WebSocket 中转） ==================== */
const NET={
  ws:null, clientMode:false, hostActive:false, inLobby:false, inGame:false,
  mySeat:-1, roomCode:null, isHost:false, lobby:[], remotes:[],
  currentAsk:null, pending:{}, pendingSeat:{}, askSeq:1, lastView:{}, _lordSaved:null,
  ASK_TIMEOUT_MS:20000,   /* 等远程玩家做任何决定的上限，超时按放弃结算（防整桌死锁） */

  /* ---------- 连接 ---------- */
  connect(){
    return new Promise((res,rej)=>{
      if(NET.ws&&NET.ws.readyState===1)return res();
      const proto=location.protocol==='https:'?'wss://':'ws://';
      const ws=new WebSocket(proto+location.host);
      ws.onopen=()=>{NET.ws=ws;res();};
      ws.onerror=()=>rej(new Error('无法连接服务器'));
      ws.onmessage=ev=>{try{NET.onMsg(JSON.parse(ev.data));}catch(e){}};
      ws.onclose=()=>NET.onClose();
    });
  },
  send(o){if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(o));},
  sendTo(seat,data){NET.send({t:'msg',to:seat,data});},
  broadcast(data){for(const r of NET.remotes)NET.sendTo(r.seat,data);},
  /* 应用层心跳：cpolar 免费隧道会把 WebSocket 搞成「TCP 半开」——
     readyState 还是 1，但消息全部黑洞、也不触发 close，玩家点什么都石沉大海（出不了牌）。
     每 8s 发一个心跳，25s 没收到任何回包就明确提示重连。 */
  startHeartbeat(){
    if(NET._hb)return;
    NET._lastMsg=Date.now();
    NET._hb=setInterval(()=>{
      if(!NET.ws||NET.ws.readyState!==1)return;
      NET.send({t:'hb'});
      if(NET._lastMsg&&Date.now()-NET._lastMsg>25000){
        NET._lastMsg=Date.now();   /* 最多每 25s 提示一次 */
        toast('连接似乎已断开（隧道不稳定），请刷新页面后重新加入房间');
      }
    },8000);
  },

  /* ---------- 大厅 ---------- */
  openLobby(){
    if(location.protocol==='file:'){toast('联机需要先启动服务器：双击运行 server.js（需安装 Node.js），再用浏览器打开它显示的网址');return;}
    const saved=localStorage.getItem('sgs_name')||'';
    openModal(`<h3>联机对局 · 五人身份局</h3>
      <div class="m-desc">你创建房间当房主（房主电脑运行游戏引擎），朋友输入房间号加入。<br>不足 5 人的空位由 AI 自动补满。</div>
      <div style="display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto;">
        <input id="net-name" maxlength="12" placeholder="你的昵称" value="${saved}" style="padding:10px;border-radius:6px;border:1px solid var(--gold-deep);background:#1d1108;color:var(--gold-bright);font-size:15px;font-family:var(--serif);">
        <input id="net-code" maxlength="4" placeholder="房间号（加入时填写）" style="padding:10px;border-radius:6px;border:1px solid var(--gold-deep);background:#1d1108;color:var(--gold-bright);font-size:15px;font-family:var(--serif);">
      </div>
      <div class="modal-actions">
        <button class="btn primary" onclick="NET.doCreate()">创建房间</button>
        <button class="btn" onclick="NET.doJoin()">加入房间</button>
        <button class="btn ghost" onclick="closeModal()">取消</button>
      </div>`);
  },
  _name(){const n=($('#net-name').value||'').trim();if(!n){toast('请先输入昵称');return null;}localStorage.setItem('sgs_name',n);return n;},
  async doCreate(){
    const name=NET._name();if(!name)return;
    try{await NET.connect();}catch(e){toast('连接服务器失败：请确认已启动 server.js');return;}
    NET.send({t:'create',name});
  },
  async doJoin(){
    const name=NET._name();if(!name)return;
    const code=($('#net-code').value||'').trim();
    if(!/^\d{4}$/.test(code)){toast('请输入 4 位数字房间号');return;}
    try{await NET.connect();}catch(e){toast('连接服务器失败：请确认已启动 server.js');return;}
    NET.send({t:'join',code,name});
  },
  leaveLobby(){
    NET.send({t:'leave'});NET.reset();UI.show('menu');toast('已离开房间');
  },
  reset(){
    NET.clientMode=false;NET.hostActive=false;NET.inLobby=false;NET.inGame=false;
    NET.mySeat=-1;NET.roomCode=null;NET.isHost=false;NET.lobby=[];NET.remotes=[];
    NET.currentAsk=null;NET.pending={};NET.pendingSeat={};NET.lastView={};
    if(NET.ws){try{NET.ws.close();}catch(e){}NET.ws=null;}
  },
  renderLobby(){
    $('#lobby-code').style.display='block';
    $('#lobby-code-num').textContent=NET.roomCode;
    $('#lobby-list').innerHTML=NET.lobby.map(m=>`<div style="display:flex;justify-content:space-between;background:rgba(20,12,6,.6);border:1px solid rgba(201,163,92,.28);border-radius:6px;padding:9px 16px;font-size:15px;">
      <span style="color:var(--gold-bright);">${m.host?'👑 ':''}${m.name}</span>
      <span style="color:#b89d6b;font-size:12px;">座位 ${m.seat+1}${m.host?' · 房主':''}</span></div>`).join('');
    $('#lobby-status').innerHTML=NET.isHost
      ?`当前 ${NET.lobby.length}/5 人。可直接开始，空位由 AI 补满。`
      :'等待房主开始游戏……';
    $('#btn-room-start').classList.toggle('hidden',!NET.isHost);
  },
  clickStart(){NET.send({t:'start'});},

  /* ---------- 消息分发 ---------- */
  onMsg(m){
    NET._lastMsg=Date.now();
    switch(m.t){
      case 'hb':break;   /* 心跳回包：只更新 _lastMsg，证明链路活着 */
      case 'room':
        closeModal();
        NET.roomCode=m.code;NET.mySeat=m.seat;NET.isHost=!!m.host;
        NET.inLobby=true;NET.clientMode=!m.host;NET.hostActive=!!m.host;
        NET.startHeartbeat();
        if(!m.host)NET.hijack(); // 客户端：点击只转发，不本地结算
        UI.show('lobby');break;
      case 'lobby':
        NET.lobby=m.players;
        if(NET.isHost)NET.remotes=m.players.filter(x=>x.seat!==0).map(x=>({seat:x.seat,name:x.name}));
        NET.renderLobby();break;
      case 'err':toast(m.msg||'出错了');break;
      case 'started':
        if(NET.isHost){UI.startSelect('identity');$('#sel-title').textContent='选择你的武将（你是主公）';}
        else{$('#lobby-status').textContent='房主已开局，正在分配武将……';}
        break;
      case 'peerLeft':NET.peerLeft(m.seat);break;
      case 'hostLeft':
        toast('房主已离开，房间解散');NET.reset();G.over=true;closeModal();UI.show('menu');break;
      case 'msg':NET.onGameMsg(m.from,m.data);break;
    }
  },
  onClose(){
    const was=NET.clientMode||NET.hostActive||NET.inLobby;
    NET.reset();
    if(was){G.over=true;try{closeModal();}catch(e){}UI.show('menu');toast('与服务器断开连接');}
  },
  onGameMsg(from,d){
    if(!d)return;
    if(NET.hostActive){ // 房主收客户端消息
      if(d.k==='act')NET.onRemoteAct(from,d);
      else if(d.k==='answer')NET.onAnswer(from,d);
      else if(d.k==='chat')NET.hostChat(from,d.text);
      return;
    }
    // 客户端收房主消息
    switch(d.k){
      case 'state':NET.applyState(d);break;
      case 'ask':NET.onAsk(d);break;
      /* 读秒专用轻量消息（几十字节）：客机本地插值平滑递减，不触发全量快照重发 */
      case 'timer':
        if(NET.clientMode&&d.s!=null){
          if(!G.timer||G.timer.seat!==d.s||G.timer.kind!=='sync')
            G.timer={kind:'sync',seat:d.s,total:d.tot||TURN_SEC,left:d.l,t0:Date.now(),onTimeout:null};
          else{G.timer.left=d.l;G.timer.total=d.tot||G.timer.total;G.timer.t0=Date.now();}
          paintTimerBars();
          if(!G.timerId)runTimer();   /* 只在没有 tick 时启动，避免重复 setInterval */
        }
        break;
      case 'sfx':SFX.play(d.id,d.vol);break;
      case 'fx':NET.onFx(d);break;
      case 'float':UI.float(d.txt,d.cls);break;
      case 'judge':UI.showJudge(d.card);break;
      case 'judgeHide':UI.hideJudge();break;
      case 'toast':toast(d.msg);break;
      case 'chat':UI.chat(d.name,d.text);break;
      case 'result':NET.onResult(d);break;
      case 'abort':toast('房主结束了对局');NET.reset();G.over=true;closeModal();UI.show('menu');break;
      case 'lordOk':NET.currentAsk=null;closeModal();toast(d.msg||'有武将替你打出');break;
      case 'askAbort':NET.currentAsk=null;closeModal();toast('已超时，视为放弃');break;
      case 'lordFail':
        if(NET._lordSaved)$('#modal-box').innerHTML=NET._lordSaved;
        toast('没有武将能替你打出，请自行打出或点"放弃"');break;
    }
  },

  /* ---------- 客户端：收到房主的交互请求 ---------- */
  onAsk(d){
    const fn=d.fn;
    NET.currentAsk={askId:d.askId,fn};
    if(fn==='chooseGeneral'){
      const opts=d.a[0];
      openModal(`<h3>选择你的武将</h3><div class="m-desc">点击一名武将参战（身份将在开局后告知）</div>
        <div class="pick-seats">${opts.map(o=>`<div class="pick-seat" style="width:150px;" onclick="resolveModal('${o.gid}')">
          <img src="${assetImg(GENERAL_MAP[o.gid].img)}"><div class="pn">${o.name}</div>
          <div style="font-size:11px;color:#b89d6b;">${KINGDOM_NAME[o.kingdom]}势力 · ${o.hp} 血</div>
          <div style="font-size:10px;color:#cbb487;padding:2px 4px;line-height:1.4;text-align:left;">${o.skills}</div>
        </div>`).join('')}</div>`);
      return;
    }
    const args=NET.deserArgs(fn,d.a);
    UI[fn](...args);
  },
  sendAnswer(ask,v){
    NET.currentAsk=null;
    NET.sendTo(0,{k:'answer',askId:ask.askId,v:NET.serAns(ask.fn,v)});
  },
  act(d){d.k='act';NET.sendTo(0,d);},
  /* ---------- 联机聊天 ---------- */
  label(p){
    if(!p)return '?';
    const g=GENERAL_MAP[p.gid];
    return (g?g.name:'?')+(p.pname?'（'+p.pname+'）':'')+(p.local?'（你）':'');
  },
  hostChat(seat,text){
    if(!NET.hostActive)return;
    const p=P(seat);if(!p)return;
    const t=String(text==null?'':text).replace(/[\r\n]+/g,' ').slice(0,40);
    if(!t)return;
    const name=NET.label(p);
    UI.chat(name,t);
    NET.broadcast({k:'chat',from:seat,name,text:t});   /* 所有人（含发送者）都从这条收到，不会重复 */
  },

  /* ---------- 客户端：播放房主广播的动画（箭头/出牌/飞牌/响应牌） ---------- */
  onFx(d){
    if(!NET.inGame)return;
    const A=d.a||[];
    try{
      if(d.fx==='arrow'){
        const s=P(A[0]),t=P(A[1]);
        if(s&&t){const w=FX.arrow(s,t);setTimeout(()=>FX.fadeArrow(w),950);}
      }
      else if(d.fx==='fly'){const p=P(A[0]);if(p)FX.flyCard(p,A[1]||1);}
      else if(d.fx==='playCard'){const p=P(A[0]),t=(A[2]!==null&&A[2]!==undefined)?P(A[2]):null;if(p)FX.playCard(p,A[1],t);}
      else if(d.fx==='respond'){const p=P(A[0]);if(p)FX.respondCard(p,A[1],A[2],A[3]);}
    }catch(e){/* 动画失败不影响游戏 */}
  },

  /* ---------- 客户端：应用房主状态快照 ---------- */
  applyState(v){
    if(!NET.inGame){
      NET.inGame=true;closeModal();
      UI.show('game');$('#view-game').classList.add('surround');
      SFX.unlock();SFX.startBgm();
    }
    G.mode=v.mode;G.turnSeat=v.turnSeat;G.turnCount=v.turnCount;G.over=v.over;
    G.deck=new Array(v.deckCnt).fill(null);
    G.discardPile=new Array(v.discardCnt).fill(null);
    G.log=v.log;
    /* 【关键】必须「就地更新」同一批 player 对象，绝不能整个替换 G.players。
       客户端上正在等待玩家操作的异步流程（等你出闪、等你选目标、deadline 等）
       手里握的是旧的 player 引用；一旦这里换新对象，旧引用就成了幽灵副本，
       它的 hp/alive 永远停在死亡前一刻 —— 于是别的客户端会出现「赵延莲死了却还活着」，
       再拿这个陈旧副本去结算就会把整局带乱（间歇出现，取决于死亡时是否正卡在该操作上）。 */
    const prevMap=new Map((G.players||[]).map(q=>[q.seat,q]));
    G.players=v.players.map(x=>{
      const snap={
        seat:x.seat,gid:x.gid,isAI:x.seat!==v.youSeat,realAI:x.isAI,
        remote:x.seat!==v.youSeat,local:x.seat===v.youSeat,
        tag:x.tag,identity:x.identity||'loyal',_idKnown:!!x.identity,
        hp:x.hp,maxHp:x.maxHp,alive:x.alive,revealed:x.revealed,
        hand:x.hand?x.hand:Array.from({length:x.handCnt},(_,i)=>({uid:'h'+x.seat+'_'+i,name:'?',type:'basic',suit:'♠',rank:1,back:true})),
        equips:x.equips,judges:x.judges,
        usedSha:x.usedSha||0,drank:!!x.drank,
        flipped:!!x.flipped,sxcmMao:x.sxcmMao||0,cdDyzt:x.cdDyzt||0,
        mic:x.mic||0,vocal:!!x.vocal,rapDmg:!!x.rapDmg,dance:!!x.dance,
        nijigen:!!x.nijigen,awakened:!!x.awakened,ecyGame:x.ecyGame||0,
        skillUnlocked:x.skillUnlocked||{},sefsGameUsed:!!x.sefsGameUsed,
        skillUsed:x.skillUsed||{},skillCount:x.skillCount||{}
      };
      const old=prevMap.get(x.seat);
      if(old){Object.assign(old,snap);return old;}   /* 同一个对象 → 所有旧引用同步看到新状态 */
      return snap;
    });
    G.playResolve=v.youAct?function(){}:null;
    G.busy=false;
    /* 谁在指定目标：房主没同步过 G.actor 的话，客户端会误用「自己」当参照人算距离，徽章数字就会错位 */
    G.actor=(v.actorSeat===null||v.actorSeat===undefined)?null:(G.players.find(q=>q.seat===v.actorSeat)||null);
    G.selecting=v.selecting?{uid:v.selecting.uid,vname:v.selecting.vname,targets:v.selecting.targets,jijiang:v.selecting.jijiang}:null;
    /* 轮到自己出牌时，桌面上不该残留旧弹窗（误触的武将详情等），
       否则弹窗盖住整张桌子，点什么都无效 —— 这就是「有时候出不了牌」。
       但房主正在等待回答的弹窗（NET.currentAsk）不能动。 */
    if(v.youAct&&!NET.currentAsk){
      const ml=document.getElementById('modal-layer');
      if(ml&&ml.classList&&!ml.classList.contains('hidden'))closeModal();
    }
    /* 读秒同步（客机只显示、不推进）：房主广播了剩余秒数，就在这里按收到时刻本地平滑递减。
       只有「座位换了」或「偏差超过 0.6 秒」才重新对齐，否则每帧都被拉回满格会看着发抖。 */
    if(v.timerSeat!=null){
      if(!G.timer||G.timer.seat!==v.timerSeat||G.timer.kind!=='sync'){
        G.timer={kind:'sync',seat:v.timerSeat,total:v.timerTotal||TURN_SEC,left:v.timerTotal||TURN_SEC,t0:Date.now(),onTimeout:null};
      }
      if(!G.timerId)runTimer();   /* 客机 runTimer 内部 auth=false：只画条，不替房主收尾 */
    }else if(G.timer&&G.timer.kind==='sync'){
      stopTimer();
    }
    UI.setTip(v.tip||(v.youAct?'出牌阶段：点击手牌使用；可发动技能或结束回合':''));
    UI.render();
    if(v.youAct&&!G.helpShown){G.helpShown=true;UI.showHelp(true);}
  },
  onResult(d){
    for(const r of d.reveal){const p=P(r.seat);if(p){p.identity=r.identity;p.revealed=true;p.tag=r.tag;}}
    setTimeout(()=>{UI.showResult(d.win,d.title,d.detail);},400);
  },

  /* ---------- 客户端：点击转发（覆盖 Game 行为） ---------- */
  /* 通过劫持 Game 的方法实现：本地不结算，只发意图 */
  hijack(){
    Game.handClick=function(uid){NET._selSoon=Date.now();NET.act({act:'handClick',uid:Number(uid)});};
    Game.seatClick=function(seat){
      /* 竞态容错：刚点了需要选目标的手牌，目标高亮还没同步过来（~1 个 RTT），
         这时点座位应当转发给房主（房主有 selecting 就处理，没有就静默忽略），
         而不是在本地弹「武将详情」弹窗把好友自己的界面挡住 */
      if(!G.selecting){
        if(NET._selSoon&&Date.now()-NET._selSoon<3000){NET.act({act:'seatClick',seat});}
        else UI.generalDetail(P(seat).gid);
        return;
      }
      NET.act({act:'seatClick',seat});
    };
    Game.onEndTurnClick=function(){NET.act({act:'endTurn'});};
    Game.cancelAction=function(){NET.act({act:'cancel'});};
    Game.skillClick=function(key){NET._selSoon=Date.now();NET.act({act:'skill',key});};
  },

  /* ---------- 房主：远程回合 ---------- */
  remotePlayPhase(p){
    return new Promise(res=>{
      G.selecting=null;G.actor=p;
      G.playResolve=res;
      UI.setTip('等待玩家 '+(p.pname||generalOf(p).name)+' 出牌……');
      armTimer('play',p.seat,()=>{
        log(`${nameHTML(p)} 超时未操作，自动跳过出牌阶段`,true);
        finishPlayPhase();
      });
      UI.render();
      runTimer();        /* 远程玩家的出牌阶段同样读秒，结束权仍在房主手里 */
    }).then(()=>{G.actor=null;G.selecting=null;});
  },
  onRemoteAct(seat,d){
    const p=P(seat);if(!p||!p.remote)return;
    if(d.act==='respLord'){NET.handleRespLord(seat,d.need);return;}
    if(G.turnSeat!==seat||!G.playResolve||G.actor!==p)return; // 非其出牌阶段
    G._netAct=true;
    try{
      if(d.act==='handClick')Game.handClick(d.uid);
      else if(d.act==='seatClick')Game.seatClick(d.seat);
      else if(d.act==='endTurn')Game.onEndTurnClick();
      else if(d.act==='cancel')Game.cancelAction();
      else if(d.act==='skill')Game.skillClick(d.key);
    }finally{G._netAct=false;}
  },
  async handleRespLord(seat,need){
    const p=P(seat);if(!p||!p.remote)return;
    const ans=await lordProxy(p,need);
    if(ans){
      if(NET.resolveSeatAsk(seat,ans))NET.sendTo(seat,{k:'lordOk',msg:(ans.proxy?generalOf(ans.proxy).name+'':'')+' 替你打出了【'+need+'】'});
    }else NET.sendTo(seat,{k:'lordFail'});
  },
  resolveSeatAsk(seat,val){
    const id=NET.pendingSeat[seat];if(id==null)return false;
    const pd=NET.pending[id];delete NET.pending[id];delete NET.pendingSeat[seat];
    pd.res(val);return true;
  },

  /* ---------- 房主：向远程玩家发起交互 ---------- */
  /* 【防死锁总闸】所有「等远程玩家做决定」的入口都走这里，一律带超时。
     以前只有出牌/响应/弃牌三类有读秒，选目标、选牌、公演三选一、选将等
     都是裸 await —— 玩家切后台/断网/不点，房主就永远卡在这一行，整桌陪葬。
     超时后按「放弃」结算（res(null)），并通知客机把弹窗关掉。 */
  askRemote(p,fn,args,ms){
    return new Promise(res=>{
      const askId=NET.askSeq++;
      const se=NET.serArgs(fn,args);
      let settled=false;
      const done=v=>{if(settled)return;settled=true;clearTimeout(to);res(v);};
      const to=setTimeout(()=>{
        delete NET.pending[askId];
        if(NET.pendingSeat[p.seat]===askId)delete NET.pendingSeat[p.seat];
        try{NET.sendTo(p.seat,{k:'askAbort',askId});}catch(e){}
        try{log(`${nameHTML(p)} 操作超时，已自动跳过`,true);}catch(e){}
        done(null);
      },ms||NET.ASK_TIMEOUT_MS);
      NET.pending[askId]={res:done,fn,seat:p.seat,extra:se.extra};
      NET.pendingSeat[p.seat]=askId;
      NET.sendTo(p.seat,{k:'ask',askId,fn,a:se.a});
    });
  },
  onAnswer(seat,d){
    const pd=NET.pending[d.askId];
    if(!pd||pd.seat!==seat)return;
    delete NET.pending[d.askId];delete NET.pendingSeat[seat];
    pd.res(NET.desAns(pd.fn,P(seat),d.v,pd.extra));
  },
  /* 房主端超时撤单：让这次询问立刻以 null 结束，并通知客机把弹窗关掉 */
  abortAsk(seat){
    const askId=NET.pendingSeat[seat];
    if(askId==null)return;
    const pd=NET.pending[askId];
    delete NET.pending[askId];delete NET.pendingSeat[seat];
    try{NET.sendTo(seat,{k:'askAbort',askId});}catch(e){}
    if(pd&&pd.res)pd.res(null);
  },

  /* ---------- 房主：状态快照下发 ---------- */
  onRender(){
    if(!NET.hostActive||!NET.inGame)return;
    /* 节流：一个回合里 UI.render() 会被调用几十次，原实现每次都对每位远程玩家
       JSON.stringify 一整份 view（含 25 条日志 + 全部角色）再比对，主线程和上行带宽
       都被反复打满。改成 60ms 合并一次，视觉上完全无感，包量降一个数量级。 */
    if(NET._rPending)return;
    NET._rPending=true;
    setTimeout(()=>{NET._rPending=false;NET.flushRender();},60);
  },
  flushRender(){
    if(!NET.hostActive||!NET.inGame)return;
    for(const r of NET.remotes){
      const v=NET.buildView(r.seat);
      const s=JSON.stringify(v);
      if(NET.lastView[r.seat]===s)continue;
      NET.lastView[r.seat]=s;
      NET.sendTo(r.seat,v);
    }
  },
  buildView(seat){
    const p=P(seat);
    const youAct=G.turnSeat===seat&&!!G.playResolve&&p.alive;
    const sel=(G.actor===p&&G.selecting)?{uid:G.selecting.uid,vname:G.selecting.vname||null,targets:G.selecting.targets,jijiang:!!G.selecting.jijiang}:null;
    return {
      k:'state',mode:G.mode,turnSeat:G.turnSeat,turnCount:G.turnCount,over:G.over,
      deckCnt:G.deck.length,discardCnt:G.discardPile.length,
      log:G.log.slice(-25),youSeat:seat,youAct,
      /* 读秒同步：带上「正在被等的人 + 剩余秒数」，客机据此画同一条进度条 */
      /* 剩余秒数不再塞进快照（每 0.5 秒就变一次，会把 4~6KB 的快照变成持续刷屏），
         改由专用的轻量 {k:'timer'} 消息同步；这里只带「谁在读秒 / 总时长」用于首次对齐 */
      timerSeat:(G.timer?G.timer.seat:null),
      timerTotal:(G.timer?G.timer.total:null),
      actorSeat:(G.actor&&G.actor.alive)?G.actor.seat:(youAct?seat:null),
      selecting:sel,
      tip:youAct?(sel?'选择目标：点击高亮角色；点"取消"放弃':playTip(p)):'',
      players:G.players.map(q=>({
        seat:q.seat,gid:q.gid,isAI:q.isAI,tag:q.tag,
        identity:(q.identity==='lord'||q.seat===seat||q.revealed||!q.alive||G.over)?q.identity:null,
        hp:q.hp,maxHp:q.maxHp,alive:q.alive,revealed:q.revealed||G.over,
        handCnt:q.hand.length,hand:q.seat===seat?q.hand:null,
        equips:q.equips,judges:q.judges,
        usedSha:q.usedSha,drank:q.drank,
        flipped:!!q.flipped,sxcmMao:q.sxcmMao||0,cdDyzt:q.cdDyzt||0,
        /* 形态 / 标记同步：不同步的话客机看不到麦克风数、看不到二次元/觉醒形态（头像不换） */
        mic:q.mic||0,vocal:!!q.vocal,rapDmg:!!q.rapDmg,dance:!!q.dance,
        nijigen:!!q.nijigen,awakened:!!q.awakened,ecyGame:q.ecyGame||0,
        skillUnlocked:q.skillUnlocked||{},sefsGameUsed:!!q.sefsGameUsed,
        skillUsed:q.seat===seat?q.skillUsed:{},skillCount:q.seat===seat?q.skillCount:{}
      }))
    };
  },

  /* ---------- 房主：开局 ---------- */
  async beginNetGame(hostGid){
    NET.inGame=true;NET.lastView={};
    G.mode='identity';G.over=false;G.turnCount=0;G.log=[];G.discardPile=[];G.helpShown=false;
    G.actor=null;G.selecting=null;G.busy=false;
    UID=1;G.deck=buildDeck();
    const mk=(seat,gid0,isAI,identity)=>({
      seat,gid:gid0,isAI,identity,
      hp:GENERAL_MAP[gid0].hp,maxHp:GENERAL_MAP[gid0].hp,
      hand:[],equips:{weapon:null,armor:null,'horse+':null,'horse-':null},
      judges:[],alive:true,usedSha:0,drank:false,skillUsed:{},skillCount:{},
      skipDraw:false,skipPlay:false,revealed:false
    });
    /* 远程玩家选将：从全部可选武将中任选（逐个询问，避免并发抢将重复） */
    const usedGids=new Set([hostGid]);
    const picks={0:hostGid};
    toast('等待其他玩家选择武将……');
    for(const r of NET.remotes){
      const pool=shuffle(PLAYABLE_IDS.filter(x=>!usedGids.has(x)));
      const opts=pool.map(gid=>({gid,name:GENERAL_MAP[gid].name,kingdom:GENERAL_MAP[gid].kingdom,hp:GENERAL_MAP[gid].hp,
        skills:GENERAL_MAP[gid].skills.map(s=>s.name+'：'+s.desc).join('<br>')}));
      const gid=await NET.askRemote({seat:r.seat},'chooseGeneral',[opts],60000);  /* 选将给足 60 秒 */
      picks[r.seat]=(gid&&GENERAL_MAP[gid]&&!usedGids.has(gid))?gid:pool[0];
      usedGids.add(picks[r.seat]);
    }
    const aiPool=shuffle(PLAYABLE_IDS.filter(x=>!usedGids.has(x)));
    /* 身份每局随机：随机座位当主公，其余身份随机分发；主公（无论谁）体力上限+1 并先行动 */
    const lordSeat=rnd(5);
    const restIds=shuffle(['loyal','rebel','rebel','renegade']);
    const idOf=s=>s===lordSeat?'lord':restIds[s<lordSeat?s:s-1];
    G.players=[];
    const host=mk(0,hostGid,false,idOf(0));host.local=true;host.tag='（房主）';G.players.push(host);
    let aiIdx=0;
    for(let s=1;s<=4;s++){
      const r=NET.remotes.find(x=>x.seat===s);
      if(r){
        const pl=mk(s,picks[s],false,idOf(s));
        pl.remote=true;pl.pname=r.name;pl.tag='（'+r.name+'）';
        G.players.push(pl);
      }else{
        G.players.push(mk(s,aiPool[aiIdx++],true,idOf(s)));
      }
    }
    const lord=P(lordSeat);lord.maxHp++;lord.hp=lord.maxHp;
    G.turnSeat=lordSeat;
    G.round=null;G.roundStartSeat=lordSeat;   /* 联机：每轮从主公位重新开始（公演等「每轮」效果的锚点） */
    for(const p of G.players)p.hand.push(...takeDeck(4));
    $('#view-menu').classList.add('hidden');
    $('#view-select').classList.add('hidden');
    $('#view-lobby').classList.add('hidden');
    $('#view-game').classList.remove('hidden');
    $('#view-game').classList.add('surround');
    $('#fx-layer').innerHTML='';
    SFX.unlock();SFX.startBgm();
    try{UI.showChat(true);}catch(e){}   /* 房主端也要亮出聊天拉手，否则房主看不到聊天入口 */
    UI.render();
    log('联机身份局开始！本局你的身份是【'+ID_TEXT[host.identity]+'】，'+(NET.remotes.length?NET.remotes.length+' 名玩家加入，其余 AI 补位':'全部 AI 补位')+'；主公是 '+nameHTML(P(lordSeat)),true);
    gameLoop();
  },

  /* ---------- 房主：结束/异常 ---------- */
  endNetGame(title,detail){
    const winMap={'主忠胜利':['lord','loyal'],'反贼胜利':['rebel'],'内奸胜利':['renegade']};
    const winners=winMap[title]||[];
    const reveal=G.players.map(p=>({seat:p.seat,identity:p.identity,alive:p.alive,gid:p.gid,
      tag:p.tag!==undefined?p.tag:(p.isAI?'（AI）':'')}));
    for(const r of NET.remotes){
      const pl=P(r.seat);
      NET.sendTo(r.seat,{k:'result',win:winners.includes(pl.identity),title,detail,reveal});
    }
  },
  peerLeft(seat){
    const i=NET.remotes.findIndex(r=>r.seat===seat);if(i>=0)NET.remotes.splice(i,1);
    delete NET.lastView[seat];
    const p=P(seat);
    if(p&&p.remote){
      p.remote=false;p.isAI=true;p.offline=true;p.tag='（AI接管）';p.pname=null;
      log(`${nameHTML(p)} 的玩家掉线，由 AI 接管`,true);
      for(const id in NET.pending){
        if(NET.pending[id].seat===seat){const pd=NET.pending[id];delete NET.pending[id];pd.res(null);}
      }
      delete NET.pendingSeat[seat];
      if(G.actor===p){G.actor=null;if(G.playResolve)finishPlayPhase();}
      UI.render();
    }
    if(NET.inLobby)NET.renderLobby();
  },
  hostAbort(){
    NET.broadcast({k:'abort'});
    G.over=true;finishPlayPhase();
    NET.reset();closeModal();UI.show('menu');
  },

  /* ---------- 客户端：退出 ---------- */
  leaveGame(){
    NET.send({t:'leave'});
    NET.reset();G.over=true;closeModal();UI.show('menu');
  },

  /* ---------- 遗计远程分配应用 ---------- */
  applyYiji(p,got,map){
    for(const c of got){
      const to=map[c.uid];
      if(to==null||to===p.seat)continue;
      const t=P(to);if(!t)continue;
      const i=p.hand.findIndex(x=>x.uid===c.uid);
      if(i>=0){p.hand.splice(i,1);t.hand.push(c);
        log(`${nameHTML(p)} 发动【遗计】，将一张牌交给 ${nameHTML(t)}`);}
    }
  },

  /* ---------- 参数序列化（房主→客户端） ---------- */
  serArgs(fn,args){
    switch(fn){
      case 'askHuman':{const c=args[0];return{a:[{need:c.need,reason:c.reason,
        source:c.source?c.source.seat:null,trick:c.trick?{name:c.trick.name}:null,
        caster:c.caster?c.caster.seat:null,target:c.target?c.target.seat:null,
        dyingTarget:c.dyingTarget?c.dyingTarget.seat:null}]};}
      case 'yesNo':case 'chooseAction':case 'pickCards':case 'guanxingHuman':
      case 'yijiDistribute':case 'chooseGeneral':return{a:args};
      case 'pickSeat':return{a:[args[0],args[1].map(p=>p.seat)]};
      case 'chooseRegionHuman':return{a:[args[0].seat,!!args[1],args[2]||null],extra:{targetSeat:args[0].seat}};
      case 'askGuicaiHuman':return{a:[args[0],args[1].seat,args[2]]};
    }
    return{a:args};
  },
  /* ---------- 答案反序列化（客户端→房主） ---------- */
  desAns(fn,p,v,extra){
    if(v===null||v===undefined)return null;
    switch(fn){
      case 'askHuman':{
        const c=p.hand.find(x=>x.uid===v.uid);
        if(!c)return null;
        return{card:c,virtualName:v.vn||undefined,via:v.via||undefined};
      }
      case 'yesNo':return!!v;
      case 'chooseAction':return v;
      case 'pickCards':{
        const pool=[...p.hand,...EQUIP_SLOTS.map(([s])=>p.equips[s]).filter(Boolean)];
        return(v||[]).map(u=>pool.find(c=>c.uid===u)).filter(Boolean);
      }
      case 'pickSeat':return P(v);
      case 'chooseRegionHuman':{
        const t=P(extra.targetSeat);if(!t)return null;
        if(v.place==='hand'){const h=t.hand;if(!h.length)return null;return{card:h[rnd(h.length)],place:'hand'};}
        if(v.place==='equip'){const c=t.equips[v.slot];return c?{card:c,place:'equip',slot:v.slot}:null;}
        if(v.place==='judges'){const c=t.judges[v.ji];return c?{card:c,place:'judges'}:null;}
        return null;
      }
      case 'guanxingHuman':{
        const byUid={};(extra.cards||[]).forEach(c=>byUid[c.uid]=c);
        return{top:(v.top||[]).map(u=>byUid[u]).filter(Boolean),bottom:(v.bottom||[]).map(u=>byUid[u]).filter(Boolean)};
      }
      case 'yijiDistribute':return v;
      case 'askGuicaiHuman':return p.hand.find(c=>c.uid===v.uid)||null;
      case 'chooseGeneral':return v;
    }
    return v;
  },
  /* ---------- 参数反序列化（客户端侧） ---------- */
  deserArgs(fn,a){
    const me=human();
    switch(fn){
      case 'askHuman':{const c=a[0];return[me,{need:c.need,reason:c.reason,
        source:c.source!=null?P(c.source):null,trick:c.trick||null,
        caster:c.caster!=null?P(c.caster):null,target:c.target!=null?P(c.target):null,
        dyingTarget:c.dyingTarget!=null?P(c.dyingTarget):null}];}
      case 'yesNo':case 'chooseAction':case 'pickCards':case 'guanxingHuman':return a;
      case 'yijiDistribute':return[me,a[0]];
      case 'pickSeat':return[a[0],a[1].map(s=>P(s)).filter(Boolean)];
      case 'chooseRegionHuman':return[me,P(a[0]),a[1],a[2]];
      case 'askGuicaiHuman':return[me,a[0],P(a[1]),a[2]];
    }
    return a;
  },
  /* ---------- 答案序列化（客户端侧） ---------- */
  serAns(fn,v){
    if(v===null||v===undefined)return null;
    switch(fn){
      case 'askHuman':return v.card?{uid:v.card.uid,vn:v.virtualName||null,via:v.via||null}:null;
      case 'yesNo':return!!v;
      case 'chooseAction':return v;
      case 'pickCards':return v.map(c=>c.uid);
      case 'pickSeat':return v.seat;
      case 'chooseRegionHuman':return v;
      case 'guanxingHuman':return{top:v.top.map(c=>c.uid),bottom:v.bottom.map(c=>c.uid)};
      case 'yijiDistribute':return{map:(G.yj&&G.yj.map)||{}};
      case 'askGuicaiHuman':return{uid:v.uid};
      case 'chooseGeneral':return v;
    }
    return v;
  }
};
/* guanxing 需要把发出的牌缓存供答案映射（挂在 askRemote extra 上） */
(function(){
  const orig=NET.askRemote;
  NET.askRemote=function(p,fn,args){
    if(fn==='guanxingHuman'){
      return orig.call(NET,p,fn,args).then(r=>r);
    }
    return orig.call(NET,p,fn,args);
  };
  const origSer=NET.serArgs;
  NET.serArgs=function(fn,args){
    const r=origSer.call(NET,fn,args);
    if(fn==='guanxingHuman')r.extra={cards:args[0]};
    return r;
  };
})();
NET.hijackGuard=function(){};
/* 资源加载闸门：只有真加载到音效元素时才启用（Node 测试环境自动跳过） */
try{ if(document.querySelectorAll('audio[id^="sfx-"]').length) Loader.start(); }catch(e){}
UI.renderLog();

</script>
